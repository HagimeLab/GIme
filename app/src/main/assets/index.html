<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GIme</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 首页 ============ -->
<div class="page on" id="tab-home">
  <div class="hello">
    <div class="txt"><i id="hiSub">今天也来刷一组</i><h1 id="hiName">GIme</h1></div>
    <span class="bl">
      <button class="icon-btn" id="themeBtn" onclick="onThemeTap(event)" aria-label="切换主题"><svg class="ico" viewBox="0 0 24 24" style="width:19px;height:19px"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button>
      <button class="icon-btn" onclick="openFS('stat')" aria-label="学习统计"><svg class="ico" viewBox="0 0 24 24" style="width:19px;height:19px"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
    </span>
  </div>

  <button class="search" onclick="openFS('search')">
    <span><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
    <b>搜索题库 / 知识点</b>
  </button>

  <!-- 今日待刷 + 进行中方案合成的一张任务 Hero（app-plan.js 渲染） -->
  <div id="planHero"></div>

  <div class="sec-title cats-head">
    <b>题库分类</b>
    <button class="cats-toggle" id="catsToggle" onclick="toggleCats()" aria-expanded="true">
      <span id="catsToggleTx">收起</span>
      <svg class="ico ar" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="cats-fold" id="catsFold">
    <div class="cats-fold-in">
      <div class="cats" id="cats"></div>
    </div>
  </div>

  <div class="sec-title"><b>今日待刷题</b><span onclick="openPaper()" style="text-decoration:underline">组卷出题</span></div>
  <div id="tasks"></div>

  <div class="sec-title"><b>学习资料</b><span>按薄弱点推荐</span></div>
  <div id="studyCard"></div>

  <div class="sec-title"><b>最近练习</b><span onclick="openFS('stat')">查看全部</span></div>
  <div class="card pad" id="recent"></div>
</div>

<!-- ============ 题库 ============ -->
<div class="page" id="tab-bank">
  <div class="sec-title" style="margin-top:0"><b>题库</b><span id="bankTotal"></span></div>
  <div id="bankList"></div>
</div>

<!-- ============ 错题本 ============ -->
<div class="page" id="tab-wrong">
  <div class="sec-title" style="margin-top:0"><b>错题本</b><span id="wrongCount"></span></div>
  <div id="wrongList"></div>
</div>

<!-- ============ 我的 ============ -->
<div class="page" id="tab-me">
  <div class="sec-title" style="margin-top:0"><b>我的</b></div>
  <div class="card pad" id="meStat"></div>
  <div class="sec-title"><b>设置</b></div>
  <div class="card pad" id="meSet"></div>
</div>

<!-- ============ 底部 tab ============ -->
<!-- ============ 启动页 ============ -->
<div id="splash">
  <div class="sp-logo" id="spLogo">
    <!-- 启动页猫的黑白原图在 design/cat-light.png / cat-dark.png。
         python3 design/make_icons.py 会重出启动页图片、应用图标母图和各密度的图标 PNG。 -->
    <img class="sp-cat sp-cat-l" src="cat-light.png" alt="">
    <img class="sp-cat sp-cat-d" src="cat-dark.png" alt="">
  </div>
  <div class="sp-word" id="spWord">GIme</div>
  <div class="sp-sub" id="spSub">刷好每一个题</div>
</div>
<div id="stage"></div>

<div class="tabs" id="tabs">
  <i class="tab-pill" id="tabPill" aria-hidden="true"></i>
  <button class="tab on" data-tab="home" onclick="tabTap('home')"><svg class="ico" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>首页</span></button>
  <button class="tab" data-tab="bank" onclick="tabTap('bank')"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M17 7h2v13H8"/></svg><span>题库</span></button>
  <button class="tab ask-tab" id="tabAsk" onclick="openChatTab()" aria-label="问大肥鱼">
    <span class="ask-fish">
      <img class="ag-l" src="agent-light.png" alt="">
      <img class="ag-d" src="agent-dark.png" alt="">
      <i class="ask-dot"></i>
    </span>
  </button>
  <button class="tab" data-tab="wrong" onclick="tabTap('wrong')"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span>错题本</span></button>
  <button class="tab" data-tab="me" onclick="tabTap('me')"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5 7-5s5.8 1.4 7 5"/></svg><span>我的</span></button>
</div>

<!-- ============ 答题页 ============ -->
<div id="quiz">
  <div class="q-head">
    <button class="bk" onclick="exitQuiz()"><svg class="ico" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <div class="ti"><b id="qTitle">单选题</b><small id="qSub"></small></div>
    <button class="gr" onclick="askClearBank()" aria-label="清空本库进度" title="清空本库进度">
      <svg class="ico" viewBox="0 0 24 24" style="width:19px;height:19px;margin-left:auto"><path d="M5 12a7 7 0 1 0 2-4.9"/><path d="M5 4.5v3.8h3.8"/></svg>
    </button>
    <button class="gr" onclick="openSheet()"><svg class="ico" viewBox="0 0 24 24" style="width:19px;height:19px;margin-left:auto"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg></button>
  </div>
  <div class="track"><i id="qBar"></i></div>
  <div class="q-body" id="qbody"></div>
  <div class="q-foot">
    <div class="navrow">
      <button id="btnPrev" onclick="go(-1)">上一题</button>
      <button class="ask" id="btnAsk" onclick="openChat()" aria-label="问大肥鱼">
        <img class="ag-l" src="agent-light.png" alt="">
        <img class="ag-d" src="agent-dark.png" alt="">
        <i class="ask-dot"></i>
      </button>
      <button id="btnAct" class="main" onclick="act()">下一题</button>
    </div>
    <div class="ask-hint">有什么不懂就点大肥鱼哦！</div>
    <div class="pill" id="qPill"></div>
  </div>
</div>

<!-- ============ 弹层 ============ -->
<div class="overlay" id="overlay" onclick="closeTop()"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h2>答题卡</h2>
  <div class="grid" id="grid"></div>
  <div class="legend" id="legend"></div>
</div>
<div class="sheet" id="sheet2"></div>
<div class="sheet" id="sheet3"></div>
<!-- 卡片悬浮窗的拦截层：点窗口外任意处把卡收回对话（薄薄一层，不遮成黑屏） -->
<div class="oui-scrim" id="ouiScrim" onclick="chatOuiScrimTap(event)"></div>
<!-- OpenUI 卡片悬浮窗：对话里那张卡「展开」后搬进这里，「收回」时原样搬回它的槽位 -->
<div class="oui-win" id="ouiWin" role="dialog" aria-label="卡片悬浮窗">
  <div class="oui-win-head">
    <span class="oui-win-t" id="ouiWinTitle">卡片</span>
    <button type="button" class="oui-win-btn" id="ouiWinMaxBtn" onclick="chatOuiMax()">全屏</button>
    <button type="button" class="oui-win-btn primary" onclick="chatOuiCollapse()">收回对话</button>
  </div>
  <div class="oui-win-body" id="ouiWinBody"></div>
</div>
<!-- 附件小浮窗的拦截层：点浮窗外任意处把它收回（薄薄一层，不遮成黑屏） -->
<div class="att-scrim" id="attScrim" onclick="chatAttachScrimTap()"></div>
<!-- 聊天里发出去的图片：点缩略图看大图。点任意处或返回键收起 -->
<div class="img-view" id="imgView" onclick="closeTop()" role="dialog" aria-label="查看图片">
  <img id="imgViewPic" alt="">
  <span class="iv-tip" id="imgViewTip" hidden>正在取原图…</span>
</div>
<div class="sheet chat" id="chat">
  <div class="handle"></div>
  <div class="chat-head">
    <span class="ava"><img class="ag-l" src="agent-light.png" alt=""><img class="ag-d" src="agent-dark.png" alt=""></span>
    <b id="chatTitle">蓝色大肥鱼</b>
    <button class="chat-cfg chat-ico" onclick="chatNewConv()" aria-label="新建会话" title="新建会话">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="chat-cfg chat-ico" onclick="openConvList()" aria-label="历史会话" title="历史会话">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
    </button>
    <button class="chat-cfg chat-ico" id="chatWeb" onclick="toggleWebSearch()" aria-label="联网搜索" title="联网搜索">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.6 2.2 4 5 4 8s-1.4 5.8-4 8c-2.6-2.2-4-5-4-8s1.4-5.8 4-8z"/></svg>
    </button>
    <button class="chat-cfg" onclick="openAgentCfg()">设置</button>
  </div>
  <div class="chat-hero" id="chatHero" hidden>
    <span class="ava hero-ava"><img class="ag-l" src="agent-light.png" alt=""><img class="ag-d" src="agent-dark.png" alt=""></span>
    <div class="hero-name">蓝色大肥鱼</div>
    <div class="hero-slot" id="chatHeroSlot"></div>
    <div class="chat-empty hero-hint">问大肥鱼这道题。它会读取当前题目和题库来回答；需要时还能把解析写回题库。</div>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="chat-hint" id="chatHint"></div>
  <div class="chat-foot" id="chatFoot">
    <div class="chat-imgs" id="chatImgs" hidden></div>
    <div class="chat-file" id="chatFileChip" hidden></div>
    <div class="chat-in" id="chatIn">
      <button class="chat-att" id="chatAttach" onclick="chatAttachSheet()" aria-label="添加附件（文件或图片）">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 12.6l6-6a3 3 0 0 1 4.3 4.3l-7.6 7.6a5 5 0 0 1-7.1-7.1l7.2-7.2"/></svg>
      </button>
      <div class="chat-field" id="chatField">
        <textarea id="chatText" rows="1" placeholder="问大肥鱼这道题…"
          oninput="chatAutoGrow(this)"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}"></textarea>
        <button class="chat-more" id="chatExpand" onclick="chatBigToggle()" hidden aria-label="悬浮展开输入框" title="悬浮展开输入框">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
        </button>
      </div>
      <button class="chat-send" id="chatSend" onclick="chatSend()">发送</button>
    </div>
  </div>
</div>
<!-- 长文本输入浮窗：字数多了点「展开」，把同一颗输入框搬进这层，写完点「收起」原路放回 -->
<div class="big-in" id="bigIn" role="dialog" aria-label="长文本输入">
  <div class="big-in-head">
    <span class="big-in-t">写给大肥鱼</span>
    <button type="button" class="big-in-btn" onclick="chatBigClose()">收起</button>
    <button type="button" class="big-in-btn primary" onclick="chatBigSend()">发送</button>
  </div>
  <div class="big-in-body" id="bigInBody"></div>
</div>
<div class="glass" id="glass"></div>
<div class="toast" id="toast"></div>
<div class="fs" id="fs"></div>
<!-- 方案库 / 方案详情：独立的整页层，返回键先回列表再关页 -->
<div class="fs" id="planPage"></div>

<script src="bank.js"></script>
<!-- OpenUI：core（533KB）改成按需加载，由 app-chat.js 的 ouiEnsureCore() 在需要时注入。
     这里只同步加载两样小东西：
     - openui-signatures.js（约 3.5KB，构建时从 bundle 导出）：系统提示要的组件签名；
     - openui-ui.js（17KB，宿主适配层）：出口 window.renderOpenUI，不依赖 core 就能解析完。 -->
<script src="ui/openui-signatures.js"></script>
<script src="ui/openui-ui.js"></script>
<script src="app-core.js"></script>
<script src="app-admin.js"></script>
<script src="app-plan.js"></script>
<script src="app-chat.js"></script>
</body>
</html>
