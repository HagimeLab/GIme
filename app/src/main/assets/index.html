<script>
"use strict";

/* ================= 数据与持久化 ================= */
var BANK = window.BANK || { subjects: [], questions: [] };
var LS = { p: "stk.progress.v2", s: "stk.settings.v2", j: "stk.session.v2", u: "stk.update.v1" };
var store = {
  read: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  write: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
var prog = store.read(LS.p, {});
var set = store.read(LS.s, { theme: "light", fscale: 100 });
/* 老版本可能把开关存成字符串 / 0 / 1（手改存档、早期迁移残留都出现过）。
   统一归一成布尔：只有明确关掉的值才算关，其余按默认开。
   归一之后 vibrate() 里的判断才有意义——否则 "false" 这种真值会被当成开启。 */
function asBool(v, dft) {
  if (v === true || v === 1 || v === "1" || v === "true" || v === "on") return true;
  if (v === false || v === 0 || v === "0" || v === "false" || v === "off") return false;
  return dft;
}
set.haptics = asBool(set.haptics, true);
set.autoExp = asBool(set.autoExp, true);
/* 旧版本可以「隐藏内置题库」，那套数据已经没有对应题库了。
   这里只做兼容清理：不再读它，但也不动它，免得降级回旧版时用户发现隐藏状态被重置 */
if (set.hidden && typeof set.hidden !== "object") set.hidden = {};
var S = store.read(LS.j, null);
var openLayers = [];
var curTab = "home";
var foldOpen = true;

var byId = {};
BANK.questions.forEach(function (q) { byId[q.id] = q; });

function P(id) { if (!prog[id]) prog[id] = { n: 0, w: 0, last: -1, b: 0, t: 0, x: 0 }; return prog[id]; }
/* 错题本是你自己维护的清单：答错过就留下，再答对也不会自动移出，只有手动/批量移出才消失。
   p.in 一旦被显式写过就以它为准；老数据没写过 p.in，退化成"答错过就算在里头" */
function inWrong(x) {
  var p = prog[x.id];
  if (!p) return false;
  if (p.in !== undefined) return p.in === 1;
  return p.w > 0;
}
function subjQs(sid, tf) {
  return BANK.questions.filter(function (q) {
    return (sid === "all" || q.subject === sid) && (!tf || q.type === tf);
  });
}
function subjName(sid) {
  if (sid === "all") return "全部题库";
  for (var i = 0; i < BANK.subjects.length; i++) if (BANK.subjects[i].id === sid) return BANK.subjects[i].name;
  return sid;
}
function esc(s) {
  /* 引号也要转义：这些字符串不只落在正文里，还会落进 value="…" 这类属性里，
     而题库名来自用户自己选的文件名，不转义就能从属性里跳出去 */
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function save() { store.write(LS.j, S); store.write(LS.p, prog); store.write(LS.s, set); }
window.saveProgress = save;

/* ================= 统计 ================= */
function stats(sid, tf) {
  var qs = subjQs(sid, tf), seen = 0, mark = 0, lastT = 0;
  /* 正确率只统计客观题：主观题是自己核对出来的「掌握 / 待复习」，
     把它算进正确率等于给了个假分数 */
  var rated = 0, right = 0;
  qs.forEach(function (q) {
    var p = prog[q.id];
    if (!p) return;
    if (p.n > 0) seen++;
    if (isObjective(q.type) && p.n > 0) { rated++; if (p.last === 1) right++; }
    if (p.b) mark++;
    if (p.t > lastT) lastT = p.t;
  });
  var wrong = qs.filter(inWrong).length;
  return { total: qs.length, seen: seen, rated: rated, right: right, wrong: wrong, mark: mark, lastT: lastT,
           rate: rated ? Math.round(right / rated * 100) : 0 };
}

/* ================= 会话 ================= */
/* 六类卡片：前五种是题型，最后一张是组卷入口。
   scored=false 的主观题不参与自动判分，只在练习里给参考答案和自我核对，
   也永远不进模拟考试——没有可靠判分规则就不能假装它是客观题。 */
var TYPES = [
  { tf: "single", name: "单选题", scored: true,
    ico: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>' },
  { tf: "multi", name: "多选题", scored: true,
    ico: '<rect x="4.5" y="4.5" width="15" height="15" rx="4.5"/><path d="M8.6 12.2l2.4 2.4 4.4-4.8"/>' },
  { tf: "judge", name: "判断题", scored: true,
    ico: '<circle cx="12" cy="12" r="8"/><path d="M9.2 12.2l2 2 3.6-4.2"/>' },
  { tf: "fill", name: "填空题", scored: false,
    ico: '<path d="M4 7h16M4 12h10M4 17h6"/><path d="M17.5 14.5v6M14.5 17.5h6"/>' },
  { tf: "short", name: "解答题", scored: false,
    ico: '<rect x="4.5" y="3.5" width="15" height="17" rx="4"/><path d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h3"/>' },
  { tf: "exam", name: "真题套卷", scored: true,
    ico: '<rect x="4.5" y="3.5" width="15" height="17" rx="4"/><path d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4"/>' }
];
var OBJECTIVE = { single: 1, multi: 1, judge: 1 };
function isObjective(t) { return OBJECTIVE[t] === 1; }
function isSubjective(t) { return t === "fill" || t === "short"; }

function examN() {
  paperInit();
  return set.paper.mode === "types" ? paperOrder().length : Math.min(set.paper.total, paperAvail());
}
function examMin() { paperInit(); return set.paper.min; }
function paperTitle() {
  var ids = Object.keys(set.paper.subs);
  if (!ids.length) return "组合卷";
  if (ids.length === BANK.subjects.length) return "全部题库";
  return ids.map(function (i) { return subjName(i); }).join(" + ");
}

/* ================= 卡片 → 答题页 共享元素转场 =================
   一套 FLIP 走天下：First 量起点矩形 → 幽灵盒子直接摆成全屏、用 transform 反算回起点（Invert）
   → Play 把变换去掉。两类入口只是"起点卡片"和"哪个文字飞到哪"不同，机制共用。
   圆角要按 X/Y 两轴分别除以当时的缩放：卡片和全屏的宽高比差得远，非等比缩放会把圆角拉成椭圆。
   Chrome 80 的 element.animate() 永远不触发 onfinish，所以时序全部用 setTimeout 串，
   并且每个动画都留引用，中断时 cancel 掉——否则 fill:"forwards" 会把终值钉在元素上。 */
var SH_IN = 350, SH_FLY = 300, SH_LAND = 200, SH_OUT = 450, SH_OUT_FADE = 120;
var SH_EASE = "cubic-bezier(0.16,1,0.3,1)";
var SH = null, SH_nodes = [], SH_back = [], SH_anim = [], SH_timer = [];

function shRM() { return !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); }
function shTok(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function shAt(ms, fn) { SH_timer.push(setTimeout(fn, ms)); }
function shAnim(el, frames, dur, delay) {
  /* fill 必须是 both：带 delay 的动画在等待期不套用起始帧，
     只写 forwards 的话元素会先按 CSS 原样亮出来、再突然跳到 opacity:0 起步，
     错峰越靠后闪得越明显——就是"卡片莫名抖一下"。 */
  var a = el.animate(frames, { duration: dur, easing: SH_EASE, fill: "both", delay: delay || 0 });
  SH_anim.push(a);
  return a;
}
function shTrack(node) { SH_nodes.push(node); return node; }
function shHold(fn) { SH_back.push(fn); }
/* 中断/收尾都走这里：还原被我们藏起来的卡片、撤掉动画、删掉临时层，一样都不留 */
function shAbort() {
  var i;
  for (i = 0; i < SH_timer.length; i++) clearTimeout(SH_timer[i]);
  for (i = 0; i < SH_back.length; i++) { try { SH_back[i](); } catch (e) {} }
  for (i = 0; i < SH_anim.length; i++) { try { SH_anim[i].cancel(); } catch (e) {} }
  for (i = 0; i < SH_nodes.length; i++) if (SH_nodes[i].parentNode) SH_nodes[i].parentNode.removeChild(SH_nodes[i]);
  SH_timer = []; SH_back = []; SH_anim = []; SH_nodes = [];
}

/* 起点卡片：入口 A 按 data-tf、入口 B 按 data-sid 找回用户真正点的那一张。
   退出时列表已被 renderAll 重建，所以每次都重查重量。
   用遍历而不是 [data-x="…"]：题库 id 来自用户导入的文件，不保证能当 CSS 标识符。 */
function shCard() {
  if (!SH) return null;
  var cat = !!SH.tf, want = cat ? SH.tf : SH.sid;
  var wraps = document.querySelectorAll(cat ? "#cats .cat-wrap" : "#bankList .swipe");
  for (var i = 0; i < wraps.length; i++) {
    if (wraps[i].getAttribute(cat ? "data-tf" : "data-sid") === want)
      return wraps[i].querySelector(cat ? ".cat" : ".card.pad");
  }
  return null;
}

function shRadius(el) { return parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0; }

/* 幽灵：盒子固定为全屏，靠 transform 落在卡片矩形上；opening=true 则卡片→全屏。
   刻意不给它任何 box-shadow——真机量过：在近全屏的缩放层上挂模糊阴影（不管是动画还是静态），
   每次缩放都要重新光栅化，一次转场掉 4–9 帧、最差 54ms；去掉后 0 帧超 33ms、max 17.6ms。
   幽灵铺满时外阴影本来就在视口外，所以"淡出"这个观感不需要真的去画它。 */
function shGhost(r, rad, opening) {
  var W = window.innerWidth, H = window.innerHeight;
  var A = opening ? r : { left: 0, top: 0, width: W, height: H };
  var B = opening ? { left: 0, top: 0, width: W, height: H } : r;
  var bg0 = opening ? shTok("--raise") : shTok("--paper");
  var bg1 = opening ? shTok("--paper") : shTok("--raise");
  var kf = [], n = 8;
  for (var i = 0; i <= n; i++) {
    var p = i / n;
    var w = A.width + (B.width - A.width) * p, h = A.height + (B.height - A.height) * p;
    var sx = w / W, sy = h / H, rr = rad * (opening ? 1 - p : p);
    var f = {
      offset: p,
      transform: "translate(" + (A.left + (B.left - A.left) * p) + "px,"
                         + (A.top + (B.top - A.top) * p) + "px) scale(" + sx + "," + sy + ")",
      borderRadius: (rr / sx) + "px / " + (rr / sy) + "px"
    };
    if (i === 0) { f.backgroundColor = bg0; }
    if (i === n) { f.backgroundColor = bg1; }
    kf.push(f);
  }
  var g = document.createElement("div");
  g.className = "share-ghost";
  g.style.width = W + "px";
  g.style.height = H + "px";
  document.body.appendChild(shTrack(g));
  shAnim(g, kf, opening ? SH_IN : SH_OUT);
}

/* 文字飞进 .q-head：克隆体按"终点"排版摆在终点矩形，位置用 transform 平移回去，
   字号则真的动画 font-size。
   不用 scale 模拟字号变化：缩放是把文字按一个尺寸光栅化后再放大/缩小，逐帧取整会让
   字形边界来回跳——矩形一动不动，看着却是"卡片在抖"。规格要的"字号渐变"本来也是这个意思。 */
function shFlyLabel(src, dst) {
  if (!src || !dst) return;
  var a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
  var cs = getComputedStyle(dst), ss = getComputedStyle(src);
  var el = document.createElement("div");
  el.className = "share-fly";
  el.textContent = src.textContent;
  el.style.left = b.left + "px";
  el.style.top = b.top + "px";
  el.style.width = b.width + "px";
  el.style.fontFamily = cs.fontFamily;
  el.style.fontWeight = cs.fontWeight;
  el.style.color = cs.color;
  el.style.textAlign = cs.textAlign;
  document.body.appendChild(shTrack(el));
  var dx = a.left + a.width / 2 - b.left - b.width / 2;
  var dy = a.top + a.height / 2 - b.top - b.height / 2;
  shAnim(el, [
    { transform: "translate(" + dx + "px," + dy + "px)", fontSize: ss.fontSize, lineHeight: ss.lineHeight },
    { transform: "translate(0,0)", fontSize: cs.fontSize, lineHeight: cs.lineHeight }
  ], SH_FLY);
}

/* 次要元素"随容器放大淡出"：幽灵是盖在列表上的纯色矩形，原元素开场就被压住，
   所以克隆一份到飞行层上让它当着用户的面消失，而不是凭空没了。cloneNode 保住原有样式。
   只用于 HTML 元素：内联 <svg> 的 className 是只读对象，改它会写坏 class。 */
function shRider(el, dy, dur) {
  if (!el) return;
  var r = el.getBoundingClientRect();
  var c = el.cloneNode(true);
  c.setAttribute("class", (el.getAttribute("class") ? el.getAttribute("class") + " " : "") + "share-fly");
  c.style.position = "fixed";
  c.style.left = r.left + "px";
  c.style.top = r.top + "px";
  c.style.width = r.width + "px";
  c.style.height = r.height + "px";
  c.style.margin = "0";
  document.body.appendChild(shTrack(c));
  shAnim(c, [{ opacity: 1, transform: "translateY(0)" },
             { opacity: 0, transform: "translateY(" + (dy || 0) + "px)" }], dur || 220);
}

function shOpen() {
  var card = shCard();
  if (!card) { shPlain(); return; }
  var r = card.getBoundingClientRect(), rad = shRadius(card);
  /* 矩形塌成 0（祖先被 display:none 藏掉）时，圆角补偿会除零，
     Chrome 直接把那一帧判为非法整帧丢弃，转场会退化成硬切 —— 不如老老实实走淡入 */
  if (!r.width || !r.height) { SH = null; shPlain(); return; }
  card.style.opacity = "0";
  shHold(function () { card.style.opacity = ""; });
  shGhost(r, rad, true);
  if (SH.tf) {
    /* 入口 A：题型名飞进大标题；数量就地淡出，语义由进度条接替；
       图标不单独处理——它就在卡片矩形上，幽灵一盖住就是"直接淡出" */
    shFlyLabel(card.querySelector("b"), document.getElementById("qTitle"));
    shRider(card.querySelector("i"));
  } else {
    /* 入口 B：题库名飞进副标题，大标题由 render() 填好的题型名自然浮出，不飞 */
    shFlyLabel(card.querySelector(".bk-name"), document.getElementById("qSub"));
    shRider(card.querySelector(".bk-pct"));
    shRider(card.querySelector(".bk-sub"));
    shRider(card.querySelector(".bk-acts"), 8);   /* 三个按钮整体下滑 8px 淡出 */
  }
  shAt(SH_IN, shLand);
}

/* 落位：幽灵铺满那一帧 #quiz 上位。两者此刻底色相同，所以关掉过渡直接换层看不出来。
   大标题不淡入——飞行标签刚停在同一个位置，再淡一次就是闪。 */
function shLand() {
  var quiz = document.getElementById("quiz");
  quiz.classList.add("snap", "on");
  shAbort();
  shContent();
  shAt(SH_LAND + 300, function () { quiz.classList.remove("snap"); });
}

/* 没有起点卡片的入口（背题/错题本/收藏/交卷回看）：走 #quiz 自带的 180ms 淡入，同样不硬切 */
function shPlain() {
  document.getElementById("quiz").classList.add("on");
  if (!shRM()) shContent();
}

function shUp(el, delay) {
  if (el) shAnim(el, [{ opacity: 0, transform: "translateY(10px)" },
                      { opacity: 1, transform: "translateY(0)" }], 180, delay);
}

function shContent() {
  var quiz = document.getElementById("quiz");
  shUp(quiz.querySelector(".track"), 40);
  var bar = document.getElementById("qBar");
  if (bar) {                                   /* 进度条从 0 长到当前进度 */
    var w = bar.style.width;
    bar.style.transition = "none";
    bar.style.width = "0";
    void bar.offsetWidth;
    bar.style.transition = "";
    bar.style.width = w;
  }
  shUp(quiz.querySelector(".stem-card"), 80);
  var opts = quiz.querySelectorAll("#qbody .opt");
  if (opts.length) {
    for (var i = 0; i < opts.length; i++) shUp(opts[i], 120 + i * 40);   /* ABCD 错峰 40ms */
  } else {
    shUp(quiz.querySelector(".q-input"), 120);
  }
  shUp(quiz.querySelector(".q-foot"), 160);
}

/* 返回：内容先淡出让位，幽灵再从全屏缩回用户实际点的那张卡片，比进入略快 */
function shClose() {
  if (shRM() || !SH) return false;
  var quiz = document.getElementById("quiz");
  var card = shCard();
  if (!card) { SH = null; return false; }
  /* 还在飞就按了返回：这一趟压根没落地，撤干净停在列表就行 */
  if (!quiz.classList.contains("on")) { SH = null; shAbort(); return true; }
  var rad = shRadius(card), r = card.getBoundingClientRect();
  if (!r.width || !r.height) { SH = null; return false; }
  /* 幽灵在 t=0 就建好开始缩，内容淡出与它并行。原来先淡 150ms 再放手，
     那 150ms 屏上什么都不动 —— 就是"退出后约 0.1 秒才看到缩回"。
     幽灵夹在 #quiz 底下，淡出这一段正好把它盖住，不会提前露出缩小的矩形。 */
  card.style.opacity = "0";
  shHold(function () { card.style.opacity = ""; });
  shGhost(r, rad, false);
  shAnim(quiz, [{ opacity: 1 }, { opacity: 0 }], SH_OUT_FADE);
  shAt(SH_OUT_FADE, function () {
    quiz.classList.remove("on", "snap");
    renderAll();
    /* renderAll 会重建列表，新节点得再藏一次，否则它会隔着幽灵露出来 */
    var c2 = shCard();
    if (c2) { c2.style.opacity = "0"; shHold(function () { c2.style.opacity = ""; }); }
  });
  shAt(SH_OUT, function () { SH = null; shAbort(); });
  return true;
}

function startSession(mode, sid, tf, from) {
  var pool = subjQs(sid, tf === "exam" ? null : tf);
  if (mode === "wrong") {
    pool = pool.filter(inWrong);
    if (!pool.length) { toast("错题本是空的"); return; }
  }
  if (mode === "star") {
    pool = pool.filter(function (q) { return prog[q.id] && prog[q.id].b; });
    if (!pool.length) { toast("还没有收藏题目"); return; }
  }
  var order = mode === "exam" ? paperOrder() : pool.map(function (q) { return q.id; });
  if (mode === "random" || mode === "wrong") shuffle(order);
  if (!order.length) {
    toast(tf && isSubjective(tf) ? "这个题库里没有" + typeName(tf) : "这个分类下没有题目");
    return;
  }

  var idx = 0;
  if (mode === "practice") {                       // 顺序练习：停在第一道没刷过的题
    for (var i = 0; i < order.length; i++) {
      if (!(prog[order[i]] && prog[order[i]].n > 0)) { idx = i; break; }
      if (i === order.length - 1) idx = 0;
    }
  }
  S = { subject: sid, mode: mode, tf: tf || "", order: order, idx: idx,
        title: mode === "exam" ? paperTitle() : "",
        state: mode === "exam" ? "running" : "",
        picks: {}, graded: {}, text: {}, self: {},
        started: Date.now(), dur: mode === "exam" ? examMin() * 60 : 0 };
  save();
  render();
  /* 上面任何一条数据检查不通过都会先 toast + return，幽灵压根不会创建，所以不存在残留 */
  shAbort();
  SH = (from && !shRM()) ? (from === "cat" ? { tf: tf } : { sid: sid }) : null;
  if (SH && !shCard()) SH = null;
  if (SH) shOpen(); else shPlain();
}

function q() { return byId[S.order[S.idx]]; }
function isExam() { return S && S.mode === "exam"; }
/* 考试状态：running 答题中 → submitting 交卷中 → submitted 已交卷 / abandoned 已放弃。
   交卷和放弃都要停表，且只认第一次，重复调用直接返回，免得一次操作出两份成绩。 */
function examDone() { return S && S.mode === "exam" && (S.state === "submitted" || S.state === "abandoned"); }
function isRecite() { return S && S.mode === "recite"; }
function noAns(cur) { return !cur.answer || !cur.answer.length; }
/* 主观题没有「答案字母」，参考答案单独放 ref 字段 */
function isSubjQ(cur) { return !!cur && isSubjective(cur.type); }
function typeName(t) {
  return { single: "单选题", multi: "多选题", judge: "判断题", fill: "填空题", short: "解答题" }[t] || "题目";
}
/* 列表里展示的「答案」：客观题拼字母，主观题给参考答案首段，没有就留空 */
function answerText(x) {
  if (!x) return "";
  if (isSubjective(x.type)) {
    var r = String(x.ref || "").trim();
    return r ? r.slice(0, 40) + (r.length > 40 ? "…" : "") : "未提供";
  }
  return (x.answer || []).join("");
}

function exitQuiz() {
  /* 答题页左上角那个返回箭头也走这里，所以考试中必须同样拦一道，
     否则绕过返回键就能把计时丢在后台 */
  if (isExam() && !examDone()) { askExitExam(); return; }
  if (!isExam()) save();
  if (shClose()) return;                       /* 有起点卡片：由它负责让位与 renderAll */
  document.getElementById("quiz").classList.remove("on", "snap");
  shAbort();
  renderAll();
}

/* ================= 答题页渲染 ================= */
function render() {
  if (!S || !S.order || !S.order.length || !S.order[S.idx]) return;
  var cur = q();
  document.getElementById("qTitle").textContent = isExam() ? "模拟考试" : typeName(cur.type);
  document.getElementById("qSub").textContent = (S.title || subjName(S.subject)) + " · " + (S.idx + 1) + " / " + S.order.length;
  document.getElementById("qBar").style.width = ((S.idx + 1) / S.order.length * 100) + "%";

  var subj = isSubjQ(cur);
  var picks = S.picks[cur.id] || [];
  /* 主观题没有「判分」，只有「已核对 / 未核对」；作答内容单独存在 S.text 里 */
  var text = (S.text && S.text[cur.id]) || "";
  var checked = subj && S.self && S.self[cur.id] !== undefined;
  var done = subj ? checked : ((isExam() || noAns(cur)) ? false : S.graded[cur.id] !== undefined);
  var reveal = subj ? true : (done || (isRecite() && !noAns(cur)));

  var tagText = subj
    ? (checked ? (S.self[cur.id] === 1 ? "自评掌握" : "待复习") : typeName(cur.type))
    : (reveal ? (S.graded[cur.id] === 1 ? "回答正确" : S.graded[cur.id] === 0 ? "回答错误" : typeName(cur.type)) : typeName(cur.type));
  var h = '<div class="stem-card"><div class="tagrow">' +
            '<span class="tag' + ((!subj && reveal && S.graded[cur.id] === 1) || (subj && checked && S.self[cur.id] === 1) ? " solid" : "") + '">' +
              tagText + "</span>" +
            '<span class="tag">' + esc(subjName(cur.subject)) + "</span>" +
          '</div><div class="stem">' + esc(cur.stem) + "</div>" +
          (cur.note ? '<div class="note">' + esc(cur.note) + "</div>" : "") +
          (!subj && noAns(cur) ? '<div class="note">题源未标注本题答案 · 此题不判分</div>' : "") +
        "</div>";

  if (subj) {
    /* 主观题：先自己写，再对照参考答案。全程不显示对错——没有判分规则就
       不能给出一个假的「回答正确」，那会直接教错人。 */
    h += '<div class="opts">' +
           '<textarea class="q-input" id="qText" placeholder="' +
             (cur.type === "fill" ? "在这里填写答案" : "先自己写下要点，再展开参考答案对照") + '"' +
             (isRecite() ? " readonly" : "") + ">" + esc(text) + "</textarea>" +
         "</div>";
    if (checked && S.self[cur.id] === 0) {
      h += '<div class="note">已标记为待复习，下次还会出现在练习里。</div>';
    }
    var ref = String(cur.ref || "").trim();
    h += '<div class="ref-box"><h4>参考答案</h4><div class="ref">' +
           (ref ? esc(ref) : "（题库未提供参考答案，可对照解析自己判断）") + "</div></div>";
    if (!isRecite() && !checked) {
      h += '<div class="selfcheck">' +
             '<button onclick="selfCheck(0)">还要再看</button>' +
             '<button class="pri" onclick="selfCheck(1)">已经掌握</button>' +
           "</div>";
    } else if (!isRecite() && checked) {
      h += '<div class="selfcheck"><button onclick="selfCheck(' + (S.self[cur.id] === 1 ? 0 : 1) + ')">' +
             (S.self[cur.id] === 1 ? "改判为待复习" : "改判为已掌握") + "</button></div>";
    }
    h += '<div class="subj-tip">填空题和解答题由你自己核对，不计入正确率，也不进模拟考试。</div>';
  } else {
    h += '<div class="opts">';
    cur.options.forEach(function (o) {
      var k = o[0], cls = "opt", m = "";
      if (reveal) {
        var isAns = cur.answer.indexOf(k) >= 0, picked = picks.indexOf(k) >= 0;
        if (isAns && picked) { cls += " right"; m = "✓"; }
        else if (isAns) { cls += " miss"; m = "答案"; }
        else if (picked) { cls += " wrong"; m = "✕"; }
        else cls += " dim";
      } else if (picks.indexOf(k) >= 0) {
        cls += " sel"; m = "✓";
      }
      h += '<button class="' + cls + '" data-k="' + k + '" onclick="pick(&quot;' + k + '&quot;)">' +
             '<span class="k">' + k + '</span><span class="v">' + esc(o[1]) + '</span><span class="m">' + m + "</span></button>";
    });
    h += "</div>";
  }

  if (done && !subj) {
    var okk = S.graded[cur.id] === 1;
    h += '<div class="verdict"><span class="mk">' + (okk ? "✓" : "✕") + "</span>" +
         '<span class="tx"><b>' + (okk ? "回答正确" : "回答错误") + "</b><i>正确答案 " +
         cur.answer.join("") + (okk ? "" : " · 已放进错题本") + "</i></span></div>";
  }
  if (reveal) {
    var ex = (cur.explain || "").trim();
    /* 解析来源必须让他看得见：题源原文 vs 按知识点撰写，可信度不是一回事 */
    var src = ex ? (cur.ex_src === "题源" ? "题源" : "编写") : "";
    h += '<button class="fold-head' + (foldOpen ? " open" : "") + '" onclick="toggleFold(event)">' +
           (subj ? "解析" : "答案 " + cur.answer.join("") + " · 解析") +
           (src ? '<span class="tag src">' + src + "</span>" : "") +
           '<svg class="ico ar" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 9l6 6 6-6"/></svg>' +
         "</button>" +
         '<div class="fold" id="fold"><div class="explain">' +
           (ex ? esc(ex) : (subj ? "（题库未提供解析）" : "（题源未提供本题答案与解析）")) + "</div></div>";
  }

  h += '<div class="tools">' +
         '<button class="' + (P(cur.id).b ? "on" : "") + '" onclick="toggleStar()">' +
           '<svg class="ico" viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.6.7-4.1 3.8 1.1 5.5-5-2.8-5 2.8 1.1-5.5L4 9.7 9.6 9z"/></svg>收藏</button>' +
         '<button class="' + (inWrong(cur) ? "on" : "") + '" onclick="toggleWrong()">' +
           '<svg class="ico" viewBox="0 0 24 24"><path d="M6 21V4h11l-1.6 4L17 12H6"/></svg>' +
           (inWrong(cur) ? "移出错题本" : "标记错题") + "</button>" +
       "</div>";

  document.getElementById("qbody").innerHTML = h;
  optBounce();          /* 题面刚被整块重画，按压回弹要补挂到新节点上 */
  var ta = document.getElementById("qText");
  if (ta) {
    /* 输入即存：切题、退到后台、被杀进程都不该丢掉刚敲的字 */
    ta.addEventListener("input", function () {
      if (!S) return;
      if (!S.text) S.text = {};
      S.text[cur.id] = ta.value;
      save();
    });
  }
  document.getElementById("btnPrev").disabled = S.idx === 0;
  document.getElementById("btnAct").textContent =
    isExam() ? (S.idx === S.order.length - 1 ? "交卷" : "下一题")
    : subj ? "下一题"
    : (isRecite() || noAns(cur) || done) ? "下一题" : "确认";
  var pill = document.getElementById("qPill");
  var pct = Math.round(Object.keys(S.graded).length / S.order.length * 100);
  if (isExam()) { tick(); }
  else { pill.textContent = "本组完成度 " + pct + "%"; }
  syncFold();
}

/* 解析折叠：容器高度与内容同步变化，箭头同步转 180° */
function syncFold() {
  var f = document.getElementById("fold");
  if (!f) return;
  f.style.transition = "none";
  f.style.height = foldOpen ? f.scrollHeight + "px" : "0px";
  void f.offsetHeight;
  f.style.transition = "";
}
function toggleFold(ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  var f = document.getElementById("fold"), head = document.querySelector(".fold-head");
  if (!f) return;
  foldOpen = !foldOpen;
  if (head) { if (foldOpen) head.classList.add("open"); else head.classList.remove("open"); }
  f.style.height = f.scrollHeight + "px";
  void f.offsetHeight;
  if (foldOpen) {
    f.style.height = f.scrollHeight + "px";
    setTimeout(function () { if (foldOpen) f.style.height = "auto"; }, 320);
  } else {
    f.style.height = "0px";
  }
}

/* ================= 交互 ================= */
function pick(k) {
  if (!S) return;
  if (examDone()) return;
  var cur = q();
  if (isSubjQ(cur)) return;        /* 主观题没有选项，这个入口不该被触发 */
  if (isRecite()) { go(1); return; }
  if (noAns(cur)) {
    var p0 = S.picks[cur.id] || (S.picks[cur.id] = []);
    if (cur.type === "multi") { var i0 = p0.indexOf(k); if (i0 >= 0) p0.splice(i0, 1); else p0.push(k); }
    else S.picks[cur.id] = [k];
    save(); render(); return;
  }
  var picks = S.picks[cur.id] || (S.picks[cur.id] = []);
  if (cur.type === "multi") {
    var i = picks.indexOf(k);
    if (i >= 0) picks.splice(i, 1); else picks.push(k);
    render();
  } else if (isExam()) {
    S.picks[cur.id] = [k];
    render();
  } else {
    S.picks[cur.id] = [k];
    grade([k]);
  }
  save();
}

function act() {
  if (!S) return;
  if (examDone()) return;
  var cur = q();
  /* 主观题只有「下一题」一种动作，判分与自评都在页面上的按钮里 */
  if (isSubjQ(cur)) { go(1); return; }
  if (noAns(cur)) { go(1); return; }
  if (isExam()) { if (S.idx === S.order.length - 1) submitExam(); else go(1); return; }
  if (isRecite()) { go(1); return; }
  if (S.graded[cur.id] !== undefined) { go(1); return; }
  grade(S.picks[cur.id] || []);
  save();
}

function same(a, b) {
  if (a.length !== b.length) return false;
  return a.slice().sort().join("") === b.slice().sort().join("");
}

function grade(picks) {
  var cur = q();
  if (isSubjQ(cur)) return;        /* 主观题走 selfCheck，永远不进自动判分 */
  if (!picks.length && cur.type === "multi") { toast("请先选择选项"); return; }
  var ok = same(picks, cur.answer) ? 1 : 0;
  S.graded[cur.id] = ok;
  foldOpen = set.autoExp !== false;
  var p = P(cur.id);
  p.n++; p.last = ok; p.t = Date.now();
  if (!ok) { p.w++; p.in = 1; }
  vibrate(ok ? [25, 30, 25] : [70, 60, 70, 60, 160]);
  render();
  toast(ok ? "✓ 回答正确" : "✕ 回答错误，正确答案 " + cur.answer.join(""));
  var body = document.getElementById("qbody"), quiz = document.getElementById("quiz");
  void body.offsetWidth;
  if (!ok) body.classList.add("shake");
  quiz.classList.add("q-flash");
  setTimeout(function () { body.classList.remove("shake"); quiz.classList.remove("q-flash"); }, 700);
}

/* 主观题的自我核对：只记录「掌握 / 待复习」，不进正确率、不进错题本。
   没有可靠判分规则，就不能让它冒充自动对错——那是把人教错的捷径。 */
function selfCheck(ok) {
  if (!S) return;
  var cur = q();
  if (!isSubjQ(cur)) return;
  if (!S.self) S.self = {};
  S.self[cur.id] = ok ? 1 : 0;
  var p = P(cur.id);
  p.n++;
  p.last = ok ? 1 : -1;
  p.t = Date.now();
  if (!ok) { p.w++; p.in = 1; }
  vibrate(ok ? [25, 30, 25] : [70, 60, 70, 60, 160]);
  render();
  save();
  toast(ok ? "已记为掌握" : "已记为待复习");
}

function go(d) {
  if (!S) return;
  if (examDone()) return;          /* 已经交卷/放弃了，不再碰会话，也不给第二次交卷机会 */
  var n = S.idx + d;
  if (n < 0) return;
  if (n >= S.order.length) {
    /* 最后一题再往后滑 = 交卷。这里必须 return，不能落进下面的换题动画：
       否则 S 已被 submitExam 清空，setTimeout 里的 render 会踩到 null。 */
    if (isExam()) submitExam();
    else toast("已到本组最后一题");
    return;
  }
  S.idx = n;
  var el = document.getElementById("qbody");
  el.style.opacity = "0";
  el.style.transform = "translateX(" + (d > 0 ? -16 : 16) + "px)";
  setTimeout(function () {
    render();
    el.style.transition = "none";
    el.style.transform = "translateX(" + (d > 0 ? 16 : -16) + "px)";
    requestAnimationFrame(function () {
      el.style.transition = "";
      el.style.opacity = "1";
      el.style.transform = "translateX(0)";
    });
  }, 130);
  save();
}

function toggleStar() {
  var p = P(q().id);
  p.b = p.b ? 0 : 1;
  toast(p.b ? "已加入收藏" : "已取消收藏");
  render(); save();
}
function toggleWrong() {
  var cur = q(), p = P(cur.id);
  p.in = inWrong(cur) ? 0 : 1;
  toast(p.in ? "已放进错题本" : "已移出错题本");
  render(); save();
}

function submitExam() {
  if (!S || !isExam()) return;
  if (S.state !== "running") return;      /* 倒计时、交卷按钮、最后一题滑动共用这一道闸 */
  S.state = "submitting";
  var right = 0, scored = 0;
  S.order.forEach(function (id) {
    var cur = byId[id];
    if (!cur || !isObjective(cur.type)) return;   /* 主观题不进卷，万一混进来也不能按对错算 */
    if (noAns(cur)) return;
    var ok = same(S.picks[id] || [], cur.answer) ? 1 : 0;
    S.graded[id] = ok; scored++;
    var p = P(id); p.n++; p.last = ok; p.t = Date.now();
    if (ok) right++; else { p.w++; p.in = 1; }
  });
  var score = scored ? Math.round(right / scored * 100) : 0;
  var sid = S.subject;
  S.state = "submitted";
  S = null;
  localStorage.removeItem(LS.j);
  save();
  document.getElementById("quiz").classList.remove("on");
  renderAll();
  glass({
    icon: score >= 60 ? "✓" : "✕",
    big: score,
    title: score >= 60 ? "通过" : "未通过",
    desc: "答对 " + right + " / " + scored + " 题，错题已进错题本",
    ok: ["回首页", function () { goTab("home"); }],
    no: ["看错题", function () { startSession("wrong", sid, ""); }]
  });
}

/* ================= 计时 ================= */
function tick() {
  if (!S || !isExam() || !S.dur || S.state !== "running") return;   /* 交卷/放弃后表就停 */
  var left = S.dur - Math.floor((Date.now() - S.started) / 1000);
  var pill = document.getElementById("qPill");
  if (left <= 0) {
    if (pill) pill.setAttribute("data-t", "00:00");
    submitExam();
    return;
  }
  var m = Math.floor(left / 60), s = left % 60;
  var txt = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  pill.setAttribute("data-t", txt);
  pill.textContent = "剩余 " + txt + " · 完成度 " +
    Math.round(Object.keys(S.graded).length / S.order.length * 100) + "%";
}
setInterval(tick, 1000);

/* ================= 首页 / 各 tab 渲染 ================= */
/* ================= 动效 =================
   四条约束：只用 transform / opacity；颜色一律走主题令牌（浅深两套自动成立）；
   曲线复用滑杆吸附那条 cubic-bezier(.34,1.56,.64,1)，全站手感一致；
   真机 WebView 是 Chrome 80，element.animate() 可用但**不派发 onfinish**，
   所以凡是要「动画结束后收尾」的一律靠 cancel() 或定时，不挂 onfinish。 */
var BOUNCE = "cubic-bezier(.34, 1.56, .64, 1)";
var EASE = "cubic-bezier(0.16, 1, 0.3, 1)";

/* ---- 1. 底部导航的流动胶囊 ---- */
var pillBox = null;                     /* 上一枚胶囊的 {x,y,w,h}，用来当动画起点 */
function moveTabPill(slide) {
  var bar = document.getElementById("tabs"), p = document.getElementById("tabPill");
  var b = bar && bar.querySelector(".tab.on");
  if (!b || !p) return;
  var x = b.offsetLeft, y = b.offsetTop, w = b.offsetWidth, h = b.offsetHeight;
  p.style.left = x + "px"; p.style.top = y + "px";
  p.style.width = w + "px"; p.style.height = h + "px";
  if (slide && p.animate && pillBox && (pillBox.x !== x || pillBox.w !== w)) {
    /* 起点是关键帧、终点是元素自己的行内值：动画跑完自然停在终点，不需要 fill 也不需要收尾回调。
       回弹来自 BOUNCE 这条 >1 的曲线——left 与 width 同时过冲，胶囊会先被拉长再弹回。 */
    p.animate([{ left: pillBox.x + "px", top: pillBox.y + "px", width: pillBox.w + "px", height: pillBox.h + "px" },
               { left: x + "px", top: y + "px", width: w + "px", height: h + "px" }],
              { duration: 420, easing: BOUNCE });
  }
  pillBox = { x: x, y: y, w: w, h: h };
}

/* ---- 2. 选项按钮的按压弹性 ---- */
var optPress = null, optPressEl = null, bounceKey = null, bounceAt = 0;
function optOf(node) { return node && node.closest ? node.closest(".opt") : null; }
function optSpring(el) {
  if (el && el.animate) {
    el.animate([{ transform: "scale(0.96)" }, { transform: "scale(1.02)", offset: 0.55 },
                { transform: "scale(1)" }], { duration: 280, easing: BOUNCE });
  }
}
document.addEventListener("pointerdown", function (e) {
  var el = optOf(e.target);
  if (!el || !el.animate) return;
  if (optPress) optPress.cancel();
  optPress = el.animate([{ transform: "scale(1)" }, { transform: "scale(0.96)" }],
                        { duration: 90, easing: "ease-out", fill: "forwards" });
  optPressEl = el;
});
function releaseOpt() {
  var el = optPressEl;
  /* 按住的这一段是 fill:forwards，不 cancel 掉按钮会永久停在 0.96；
     手指滑出按钮时 pointerup 的 target 已不是它，所以收尾认的是「按住的那只」而不是事件目标。 */
  if (optPress) { optPress.cancel(); optPress = null; }
  optPressEl = null;
  if (!el) return;
  bounceKey = el.getAttribute("data-k");
  bounceAt = Date.now();
  optSpring(el);
}
document.addEventListener("pointerup", releaseOpt);
document.addEventListener("pointercancel", releaseOpt);
/* 选中/判分会立刻重画整块题面，旧节点连同它身上的动画一起被换掉，
   所以回弹要在新节点上补一次；超过一帧半就当作已经错过，别在下次无关重画时凭空弹一下。 */
function optBounce() {
  if (!bounceKey) return;
  var k = bounceKey, stale = Date.now() - bounceAt > 250;
  bounceKey = null;
  if (stale) return;
  var el = document.querySelector('.opt[data-k="' + k + '"]');
  optSpring(el);
}

/* ---- 3. 切页：旧页淡出 → 新页淡入 + 卡片交错入场 ----
   顺序按语义点名，不按 DOM 顺序：首页是「搜索框 → 题型卡片（6 张同时）→ 今日待刷题 → 最近练习」，
   题库页是「导入卡片 → 筛选标签 → 题库列表卡片」。每组占一个 40ms 槽位，
   列表类那一组内部再按 40ms 逐张排开；单段时长 300ms，曲线用弹簧。
   只用 transform / opacity，Chrome 80 上两者都能被 element.animate 插值。 */
var TAB_ORDER = ["home", "bank", "wrong", "me"];
var swapSeq = 0, swapTimer = null;

function pageKids(pg, cls) {
  var out = [], i;
  for (i = 0; i < pg.children.length; i++) {
    if (pg.children[i].className && pg.children[i].className.indexOf(cls) >= 0) out.push(pg.children[i]);
  }
  return out;
}
function pageKidById(pg, id) {
  var i;
  for (i = 0; i < pg.children.length; i++) if (pg.children[i].id === id) return pg.children[i];
  return null;
}
/* 一个「小节」= 它的标题行 + 紧跟其后的列表容器，两者同时进 */
function sectionOf(pg, listId) {
  var list = pageKidById(pg, listId), out = [];
  if (!list) return out;
  var p = list.previousElementSibling;
  if (p && p.className.indexOf("sec-title") >= 0) out.push(p);
  out.push(list);
  return out;
}
function enterGroups(which, pg) {
  if (which === "home") {
    var cats = document.getElementById("cats");
    var head = pageKids(pg, "cats-head");
    return [
      { els: pageKids(pg, "search"), step: 0 },
      { els: head.concat(cats ? [].slice.call(cats.children) : []), step: 0 },
      { els: sectionOf(pg, "tasks"), step: 0 },
      { els: sectionOf(pg, "recent"), step: 0 }
    ];
  }
  if (which === "bank") {
    var list = pageKidById(pg, "bankList");
    var cards = list ? [].slice.call(list.querySelectorAll(".swipe")) : [];
    return [
      { els: list && list.firstElementChild ? [list.firstElementChild] : [], step: 0 },
      { els: list ? [].slice.call(list.querySelectorAll(".tbar")) : [], step: 0 },
      { els: cards.slice(0, 8), step: 40 }
    ];
  }
  /* 错题本与「我的」没有指定的点名顺序：按页内出现次序逐块排开 */
  var items = [], i;
  for (i = 0; i < pg.children.length; i++) {
    var k = pg.children[i];
    if (!k.className && k.children.length) {
      for (var j = 0; j < k.children.length && j < 8; j++) items.push(k.children[j]);
    } else items.push(k);
  }
  return [{ els: items.slice(0, 10), step: 40 }];
}
function enterPage(which, pg) {
  if (!pg || !pg.animate) return;
  pg.animate([{ opacity: 0, transform: "translateY(12px)" },
              { opacity: 1, transform: "translateY(0)" }],
             { duration: 300, easing: BOUNCE });
  var groups = enterGroups(which, pg), slot = 0, g, i;
  for (g = 0; g < groups.length; g++) {
    for (i = 0; i < groups[g].els.length; i++) {
      groups[g].els[i].animate([{ opacity: 0, transform: "translateY(16px)" },
                                { opacity: 1, transform: "translateY(0)" }],
                               /* fill: backwards 必须有：带 delay 的动画在等待期不生效，
                                  元素会先以完全不透明亮一帧再消失，看着就是闪一下 */
                               { duration: 300, delay: slot * 40 + i * groups[g].step, easing: BOUNCE,
                                 fill: "backwards" });
    }
    slot++;
  }
}

/* ---- 4. 启动页：呼吸 → 圆形揭幕 → 首页交错浮入 ----
   第一帧就是 #splash 的主题底色，全程没有白屏；揭幕期间首页节点被临时搬进
   被圆形裁剪的 #stage，跑完再按原兄弟位置插回 body。
   交错用 fill:forwards 收尾——因为入场前给元素压了行内 opacity:0，
   不 fill 的话动画一结束元素会退回透明，所以结束时要「先放行内终值、再 cancel」。 */
var BOOT_BREATH = 600, BOOT_REVEAL = 700, BOOT_STEP = 60, BOOT_WAIT = 1800;
var banksLoaded = false;

function bootGroups(home) {
  var cats = [].slice.call(document.getElementById("cats").children);
  return [
    { els: pageKids(home, "hello"), step: 0 },
    { els: pageKids(home, "search"), step: 0 },
    { els: pageKids(home, "cats-head").concat(cats), step: 20 },
    { els: sectionOf(home, "tasks"), step: 0 },
    { els: sectionOf(home, "recent"), step: 0 },
    { els: [document.getElementById("tabs")], step: 0 }
  ];
}
function bootSplash() {
  var sp = document.getElementById("splash"), stage = document.getElementById("stage");
  var home = document.getElementById("tab-home"), tabs = document.getElementById("tabs");
  if (!sp) return;
  if (!stage || !sp.animate || !("clipPath" in document.documentElement.style)) {
    if (sp.parentNode) sp.parentNode.removeChild(sp);      /* 缺 clip-path 动画的内核：不做揭幕，直接进首页 */
    return;
  }
  var groups = bootGroups(home), items = [], bootAnims = [], g, i;
  for (g = 0; g < groups.length; g++) {
    for (i = 0; i < groups[g].els.length; i++) if (groups[g].els[i]) items.push(groups[g].els[i]);
  }
  for (i = 0; i < items.length; i++) { items[i].style.opacity = "0"; items[i].style.transform = "translateY(16px)"; }

  var restore = [[home, home.nextSibling], [tabs, tabs.nextSibling]];
  /* 搬进舞台 = 首页此刻的可见性完全由启动页负责。编排中途任何意外都必须还原，
     否则用户面对的会是一个永久透明的首页，而不是一个小 bug。 */
  function bail() {
    for (var k = 0; k < restore.length; k++) {
      if (restore[k][0].parentNode !== document.body) document.body.insertBefore(restore[k][0], restore[k][1]);
    }
    if (stage.parentNode) stage.parentNode.removeChild(stage);
    if (sp.parentNode) sp.parentNode.removeChild(sp);
    for (var m = 0; m < items.length; m++) { items[m].style.opacity = ""; items[m].style.transform = ""; }
  }
  try {
    stage.appendChild(home);
    stage.appendChild(tabs);
    run();
  } catch (e) {
    bail();
    return;
  }

  function run() {
  var logo = document.getElementById("spLogo"), word = document.getElementById("spWord"), sub = document.getElementById("spSub");
  function breathe() {
    logo.animate([{ transform: "scale(1)" }, { transform: "scale(1.06)", offset: 0.5 }, { transform: "scale(1)" }],
                 { duration: BOOT_BREATH, easing: EASE });
  }
  breathe();
  word.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: 120, easing: EASE, fill: "forwards" });
  sub.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: 260, easing: EASE, fill: "forwards" });

  var t0 = Date.now();
  /* 数据没读完就再呼吸一轮，不转圈不进度条。上限是必要的：读失败和读得慢
     在这里长得一模一样，无限等会把用户挡在「导入题库」入口之外，而那正是唯一的出路 */
  function waitData() {
    if (banksLoaded || Date.now() - t0 > BOOT_WAIT) { reveal(); return; }
    breathe();
    setTimeout(waitData, BOOT_BREATH);
  }
  setTimeout(waitData, BOOT_BREATH);

  function reveal() {
    stage.style.clipPath = "circle(150% at 50% 50%)";
    stage.animate([{ clipPath: "circle(0px at 50% 50%)" }, { clipPath: "circle(150% at 50% 50%)" }],
                  { duration: BOOT_REVEAL, easing: "cubic-bezier(.55, 0, .85, .35)" });
    var art = [logo, word, sub];
    for (var k = 0; k < art.length; k++) {
      art[k].animate([{ opacity: 1 }, { opacity: 0 }],
                     { duration: BOOT_REVEAL * 0.55, easing: "ease-in", fill: "forwards" });
    }
    setTimeout(finish, BOOT_REVEAL);
  }
  function finish() {
    for (var k = 0; k < restore.length; k++) document.body.insertBefore(restore[k][0], restore[k][1]);
    if (stage.parentNode) stage.parentNode.removeChild(stage);
    if (sp.parentNode) sp.parentNode.removeChild(sp);
    /* 交错一次性按 delay 排好，而不是逐组 setTimeout：定时器更少，
       而且每条动画的延迟是可读到、可核对的数字 */
    var last = 0;
    for (var s = 0; s < groups.length; s++) {
      var els = groups[s].els, step = groups[s].step;
      for (var m = 0; m < els.length; m++) {
        if (!els[m] || !els[m].animate) continue;
        var d = s * BOOT_STEP + m * step;
        if (d > last) last = d;
        bootAnims.push(els[m].animate([{ opacity: 0, transform: "translateY(16px)" },
                                       { opacity: 1, transform: "translateY(0)" }],
                                      /* both 不是笔误：这些元素 CSS 里本来就是可见的，
                                         只写 forwards 的话 delay 期间会先亮出来再消失 */
                                      { duration: 300, delay: d, easing: BOUNCE, fill: "both" }));
      }
    }
    setTimeout(function () {
      for (var m2 = 0; m2 < items.length; m2++) { items[m2].style.opacity = "1"; items[m2].style.transform = ""; }
      for (var a = 0; a < bootAnims.length; a++) { try { bootAnims[a].cancel(); } catch (e) {} }
    }, last + 360);
  }
  }   /* run() —— 上面整段编排都在 try 的保护里 */
}

function goTab(which) {
  var from = document.querySelector(".page.on");
  var to = document.getElementById("tab-" + which);
  curTab = which;
  /* 遍历的是 #tabs .tab，不能遍历 children：里面还有一颗流动胶囊，
     它不是按钮，被顺手写上 class="tab" 就会跟着变色变形 */
  var tabs = document.querySelectorAll("#tabs .tab");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].className = "tab" + (TAB_ORDER[i] === which ? " on" : "");
  }
  moveTabPill(true);          /* 胶囊当场就走，切页的 200ms 淡出期间它就是反馈 */
  swapPage(from, to, which);
}

function swapPage(from, to, which) {
  var my = ++swapSeq;
  if (swapTimer) { clearTimeout(swapTimer); swapTimer = null; }
  function show() {
    if (my !== swapSeq) return;
    if (from && from !== to) from.className = "page";
    to.className = "page on";
    /* 淡出留下的行内 opacity=0 必须在这里清掉，否则下次进这一页是全透明的 */
    to.style.opacity = "";
    to.style.transform = "";
    renderAll();
    enterPage(which, to);
  }
  if (!from || from === to || !from.animate) { show(); return; }
  /* 先把行内值压成 0 再跑 1→0 的动画：动画结束后不 fill，靠这个行内值保持隐藏。
     少了这一步，动画收尾的那一帧会闪回旧页。 */
  from.style.opacity = "0";
  from.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: "ease-out" });
  swapTimer = setTimeout(show, 200);
}
/* 底部四个 tab 的点击入口。和 goTab 分开：程序内部跳转（结算页的「回首页」等）
   不该顺带联网查版本，只有用户真点了「我的」才触发静默检查 */
function tabTap(which) {
  goTab(which);
  if (which === "me") checkUpdateSilently();
}

/* 分类区整体展开/收起。和单个题型无关，所以只存一个布尔值；
   不落盘——重启后展开是最不容易让人迷路的状态 */
var catsClosed = false;

function renderHome() {
  var all = stats("all");
  var noQ = !all.total;
  document.getElementById("hiName").textContent = noQ ? "先导入一个题库" : (all.seen ? "继续上次进度" : "先挑一个题库");
  /* 空题库时下面那张「还没有题目」的卡已经把该导入什么说清楚了，
     这里再挂一行格式说明就是重复，而且会把问候语挤成两行 */
  var sub = document.getElementById("hiSub");
  sub.textContent = noQ ? "" : "共 " + all.total + " 题 · 已刷 " + all.seen + " 题";
  sub.hidden = noQ;

  var cats = "";
  TYPES.forEach(function (t) {
    var n, sub2;
    if (t.tf === "exam") { n = examN(); sub2 = n + " 题 / 卷"; }
    else { n = stats("all", t.tf).total; sub2 = n + " 题"; }
    cats += '<div class="cat-wrap" data-tf="' + t.tf + '">' +
              '<button class="cat" onclick="catGo(&quot;' + t.tf + '&quot;)">' +
                '<svg class="ico" viewBox="0 0 24 24">' + t.ico + "</svg>" +
                "<b>" + t.name + "</b><i>" + sub2 + "</i></button>" +
            "</div>";
  });
  document.getElementById("cats").innerHTML = cats;
  syncCatsFold();
  renderTasks(noQ);
}

/* 折叠：只改一个容器的类，六张卡片一起动，不会逐张错位。
   高度必须由 JS 量：这台机器的 WebView 是 Chrome 80，
   grid-template-rows 的 0fr→1fr 过渡（Chrome 107+）会被忽略成瞬跳。
   量完把终点写死成像素，过渡结束后再放开成 auto——
   否则字号调大或换行变多时，写死的高度会把内容裁掉。 */
var catsFoldState = null;      /* null = 还没同步过；true/false = 上一次的展开状态 */

function syncCatsFold() {
  var fold = document.getElementById("catsFold");
  var btn = document.getElementById("catsToggle");
  var tx = document.getElementById("catsToggleTx");
  if (!fold) return;
  var closed = catsClosed;
  var changed = catsFoldState !== closed;
  catsFoldState = closed;

  if (btn) btn.setAttribute("aria-expanded", closed ? "false" : "true");
  if (tx) tx.textContent = closed ? "展开" : "收起";

  if (!changed) {
    /* 状态没变（renderHome 重画卡片时会走到这里）：高度保持现状，
       重画不该再触发一次动画，否则每次点别的按钮分类区都抖一下 */
    if (!closed) fold.style.height = "auto";
    return;
  }

  if (closed) {
    /* 收起：先固定当前像素高度，再收到 0，过渡才有起点 */
    fold.style.height = fold.scrollHeight + "px";
    void fold.offsetHeight;
    fold.classList.add("closed");
    fold.style.height = "0px";
    return;
  }

  /* 展开：容器此刻是 0 高，scrollHeight 量到的就是内容自然高度 */
  fold.classList.remove("closed");
  fold.style.height = "auto";
  var target = fold.scrollHeight;
  fold.style.height = "0px";
  void fold.offsetHeight;
  fold.style.height = target + "px";
  setTimeout(function () {
    if (!catsClosed) fold.style.height = "auto";
  }, 320);
}
function toggleCats() {
  catsClosed = !catsClosed;
  syncCatsFold();
  vibrate(10);
}
function catGo(tf) {
  if (tf === "exam") { openExam("all"); return; }   /* 模拟卷是另一套页面，不接本转场 */
  startSession("practice", "all", tf, "cat");
}

/* 空题库时只留一张卡：标题说清楚「还没有题目」，副标题说清楚点进去做什么。
   格式说明由导入面板负责，这里不再重复一遍 */
function emptyTaskHtml() {
  return '<button class="task" onclick="openImport()">' +
           '<span class="ck"><span class="box"></span></span>' +
           '<span class="bd"><b>还没有题目</b><small>点这里导入题库</small></span>' +
           '<span class="rt">导入</span></button>';
}

function renderTasks(noQ) {
  var rows = noQ ? emptyTaskHtml() : "";
  BANK.subjects.forEach(function (s) {
    var t = stats(s.id);
    /* 与题库页同一条过滤：一道题都没有的题库不出现在这里。
       少了这一格，「今日待刷」会列出题库页里根本看不到的名字（用户报的那条）。 */
    if (!t.total) return;
    var left = t.total - t.seen;
    rows += '<div class="swipe" data-sid="' + s.id + '">' +
              '<div class="swipe-acts">' +
                '<button class="swipe-act" onclick="askDeleteBank(&quot;' + s.id + '&quot;)">删除</button>' +
              "</div>" +
              '<button class="task" onclick="pickMode(&quot;practice&quot;,&quot;' + s.id + '&quot;)">' +
              '<span class="ck"><span class="box' + (left <= 0 ? " ok" : "") + '"></span></span>' +
              '<span class="bd"><b>' + esc(s.name) + "</b><small>" +
                (left <= 0 ? "已全部刷过" : "剩余 " + left + " 题未刷") + " · 正确率 " + t.rate + "%</small></span>" +
              '<span class="rt">' + left + "<i>题</i></span>" +
            "</button></div>";
  });
  var w = wrongList();
  if (!noQ || w.length) {
    rows += '<button class="task" onclick="pickMode(&quot;wrong&quot;,&quot;all&quot;)">' +
              '<span class="ck"><span class="box' + (w.length ? "" : " ok") + '"></span></span>' +
              '<span class="bd"><b>错题本</b><small>' +
              (w.length ? "答错过的题，答对不会自动移出" : "已经清空了") + "</small></span>" +
              '<span class="rt">' + w.length + "<i>题</i></span></button>";
  }
  document.getElementById("tasks").innerHTML = rows;

  var rec = BANK.subjects.map(function (s) { var t = stats(s.id); t.id = s.id; t.name = s.name; return t; })
    .filter(function (t) { return t.seen > 0; })
    .sort(function (a, b) { return b.lastT - a.lastT; }).slice(0, 4);
  document.getElementById("recent").innerHTML = rec.length ? rec.map(function (t) {
    return '<div class="rec"><span class="n">' + esc(t.name) +
             "<i>完成 " + t.seen + " / " + t.total + " 题</i></span>" +
             '<span class="p"><b>' + t.rate + "%</b><small>正确率</small></span></div>";
  }).join("") : '<div class="cap" style="margin:0">还没有练习记录</div>';
}

function wrongList() {
  return BANK.questions.filter(inWrong);
}

var bankTf = "";
var BANK_TAGS = [["", "全部"], ["single", "单选题"], ["multi", "多选题"], ["judge", "判断题"],
                 ["fill", "填空题"], ["short", "解答题"]];
var tfU = null, tfSlide = false;

/* 用户点筛选才该有东西在爬；程序内部改 bankTf 不该，所以「要不要滑」在这里置位，
   由下一次渲染消费掉 */
function setBankTf(tf) { tfSlide = (tf !== bankTf); bankTf = tf; renderBank(); }

/* 下划线元素跟着每次重建的 tbar 一起新建，所以「上一枚在哪」只能记在 tfU 里。
   中间那一帧把条拉到同时盖住新旧两枚的跨度：前端先到、后端才收，就是虫在爬。 */
function drawTfUnderline() {

/* ================= 检查更新 ================= */
var APP_VER = "1.0.3";
try { if (window.Android && Android.appVersion) APP_VER = Android.appVersion() || APP_VER; } catch (e) {}

/* 更新状态拆成三份，别混在一个布尔里：
   upd.req      —— 请求是否在飞（自动/手动共用，同一时刻只允许一个）
   upd.silent   —— 这次请求是自动检查还是用户点的
   upd.avail / upd.dismissed —— 已知可用的版本、用户点了「稍后」的版本
   后两项要落盘：杀进程再回来，小红点还得在。 */
var upd = { req: false, silent: false, avail: "", dismissed: "", hasNew: false };
(function () {
  var s = store.read(LS.u, null);
  if (!s || typeof s !== "object") return;
  upd.avail = typeof s.avail === "string" ? s.avail : "";
  upd.dismissed = typeof s.dismissed === "string" ? s.dismissed : "";
})();
function updSave() { store.write(LS.u, { avail: upd.avail, dismissed: upd.dismissed }); }
/* 小红点只由「已知可用版本 > 当前版本」推出来，不单独存一个布尔，
   否则版本升级后标记会赖着不走 */
function updSyncMark() {
  upd.hasNew = !!(upd.avail && Android_verNewer(upd.avail, APP_VER));
}
function Android_verNewer(a, b) {
  /* 版本比较的唯一真源在原生 Ver.isNewer：页面这边只做等价的数值分段比较，
     规则保持一致（去掉 v 前缀、按 . 分段比数值），绝不比字符串 */
  var pa = String(a == null ? "" : a).replace(/^[vV]/, "").split("."),
      pb = String(b == null ? "" : b).replace(/^[vV]/, "").split(".");
  var n = Math.max(pa.length, pb.length);
  for (var i = 0; i < n; i++) {
    var x = parseInt(pa[i] || "0", 10), y = parseInt(pb[i] || "0", 10);
    if (isNaN(x)) x = 0;
    if (isNaN(y)) y = 0;
    if (x !== y) return x > y;

}

/* 手动检查。force=false 时，若自动检查刚查过且没有新结果，就直接用缓存的状态收尾，
   避免用户狂点「检查更新」把 GitHub 匿名配额（60 次/小时）烧光；
   真的发现新版本、或者距上次检查超过 COOL 毫秒，仍然照常联网。 */
var UPD_COOL = 60 * 1000;
var updLast = 0;              /* 上一次检查结束的时刻（Date.now） */
function checkUpdate(force) {
  if (!window.Android || !Android.checkUpdate) { toast("请在手机上使用 App 检查更新"); return; }
  /* 自动检查还在飞的时候用户点了「检查更新」：不另开一条请求（两条回调会互相踩），
     而是把这条在飞的请求升级成手动模式，结果照常弹给用户看 */
  if (upd.req) {
    if (upd.silent) { upd.silent = false; toast("正在检查更新…"); }
    return;
  }
  if (!force && !upd.hasNew && updLast && Date.now() - updLast < UPD_COOL) {
    glass({ icon: "✓", title: "目前已经为最新版本", desc: "当前版本 v" + APP_VER, no: null, ok: ["确定"] });
    return;
  }
  upd.req = true;
  upd.silent = false;

  setTimeout(function () { upd.req = false; }, 20000);

/* 进入「我的」时静默查一次。失败、无更新都不吭声，只有发现新版本才提醒 */
function checkUpdateSilently() {
  if (!window.Android || !Android.checkUpdate) return;
  if (upd.req) return;                 /* 手动检查在飞时不要再叠一条 */
  /* 来回切 tab 会一秒点好几次「我的」，冷却期内不重复打 GitHub 的匿名配额 */
  if (updLast && Date.now() - updLast < UPD_COOL) return;
  upd.req = true;
  upd.silent = true;
  Android.checkUpdate();
  setTimeout(function () { upd.req = false; }, 20000);
}

/* 吸附滑杆：拖动跟手，松手按速度做惯性投影，再吸附到整数题数 */
var activeSl = null;

function makeSlider(el, values, getIdx, setIdx, unit) {
  var track = el.querySelector(".sl-track"), knob = el.querySelector(".sl-knob"),
      fill = el.querySelector(".sl-fill"), label = el.querySelector(".sl-top i");
  function show(i) { if (label) label.textContent = values[i] + (unit || ""); }
  var out = {
    paint: function (p) {
      p = Math.max(0, Math.min(1, p));
      knob.style.left = (p * 100) + "%";
      fill.style.width = (p * 100) + "%";
    },
    idx: function (p) { return Math.max(0, Math.min(values.length - 1, Math.round(p * (values.length - 1)))); },
    down: function (e) {
      var t = e.touches ? e.touches[0] : e;
      activeSl = out;
      /* 手指按在轨道哪里就跳到哪里，再跟手 1:1 拖 */
      var q = Math.max(0, Math.min(1, (t.clientX - track.getBoundingClientRect().left) / (track.clientWidth || 1)));
      out.d = { x0: t.clientX, p0: q, p: q, wp: q, wt: Date.now(), v: 0, w: track.clientWidth || 1 };
      el.classList.remove("snap");
      out.paint(q);
      show(out.idx(q));
      if (e.preventDefault) e.preventDefault();
    },
    move: function (e) {
      if (!out.d) return;
      var d = out.d, t = e.touches ? e.touches[0] : e, now = Date.now();
      var p = Math.max(0, Math.min(1, d.p0 + (t.clientX - d.x0) / d.w));
      /* 速度要按 >=60ms 的窗口取：事件被合批到同一毫秒时瞬时速度虚高，慢拖也会被判成甩动 */
      var wt = now - d.wt;
      if (wt >= 60) { d.v = (p - d.wp) / wt; d.wp = p; d.wt = now; }
      d.p = p;
      out.paint(p);
      show(out.idx(p));
      if (e.preventDefault) e.preventDefault();
    },
    up: function () {
      if (!out.d) return;
      /* 慢放到手就停在手那儿，只有真的甩出去才带惯性；投影幅度封顶，一次抖动不会跨满全程 */
      var v = out.d.v;
      var fling = Math.abs(v) < 0.0015 ? 0 : Math.max(-0.18, Math.min(0.18, v * 45));
      var projected = Math.max(0, Math.min(1, out.d.p + fling));
      var i = out.idx(projected);
      out.d = null;
      el.classList.add("snap");
      out.paint(i / (values.length - 1));
      show(i);
      setIdx(i);
    }
  };
  track.addEventListener("touchstart", out.down, { passive: false });
  track.addEventListener("mousedown", out.down);
  out.paint(getIdx() / (values.length - 1));
  show(getIdx());
  return out;
}
document.addEventListener("touchmove", function (e) { if (activeSl) activeSl.move(e); }, { passive: false });
document.addEventListener("mousemove", function (e) { if (activeSl) activeSl.move(e); });
document.addEventListener("touchend", function () { if (activeSl) activeSl.up(); });
document.addEventListener("mouseup", function () { if (activeSl) activeSl.up(); });

/* ---------------- 组卷：题库多选 + 按总题数 / 按题型分配 ---------------- */
function paperInit() {
  if (!set.paper) {
    var subs = {};
    /* 题库可能一个都没有（全是用户导入的，随时可能被删干净），
       这里不能直接取 subjects[0].id，否则空题库时组卷一点就抛异常 */
    if (BANK.subjects.length) subs[BANK.subjects[0].id] = 1;
    set.paper = { subs: subs, mode: "total", total: 30, single: 10, multi: 10, judge: 10, min: 20 };
  }
}
function paperPool() {
  paperInit();
  /* 模拟考试只抽客观题：主观题没有可靠判分规则，塞进限时卷里交卷会算错分 */
  return BANK.questions.filter(function (q) {
    return set.paper.subs[q.subject] && isObjective(q.type);

function paperAvail(tf) {
  return paperPool().filter(function (q) { return !tf || q.type === tf; }).length;
}
function paperOrder() {
  var p = set.paper, pool = paperPool();
  if (p.mode !== "types") {
    return shuffle(pool.map(function (q) { return q.id; })).slice(0, Math.min(p.total, pool.length));
  }
  var out = [];
  ["single", "multi", "judge"].forEach(function (t) {
    var ids = shuffle(pool.filter(function (q) { return q.type === t; }).map(function (q) { return q.id; }));
    out = out.concat(ids.slice(0, p[t]));
  });
  return shuffle(out);
}
/* 滑杆是连续整数档（下限..上限），刻度只标 0/¼/½/¾/满，这样"40 题"这种具体数字能落准 */

    return '<span style="' + st + '">' + v + "</span>";

    value + unit + '</i></div>' +

function wireSlider(id, lo, hi, get, put, unit) {
  var values = [];

/* ================= 手势 ================= */
(function () {
  var drag = null;
  document.addEventListener("touchstart", function (e) {
    var p = e.touches[0], t = e.target;
    var sheet = document.querySelector(".sheet.on");
    if (sheet && p.clientY - sheet.getBoundingClientRect().top < 56) {
      drag = { el: sheet, axis: "y", y0: p.clientY, h: sheet.offsetHeight };
    } else if (!openLayers.length && S && document.getElementById("quiz").classList.contains("on")
               && t.closest && t.closest(".q-body")) {
      drag = { swipe: true, x0: p.clientX, y0: p.clientY, axis: "" };
    }
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (!drag) return;
    var p = e.touches[0];
    if (drag.el) {
      drag.el.style.transition = "none";
      drag.el.style.transform = "translateY(" + Math.max(0, p.clientY - drag.y0) + "px)";
      return;
    }
    if (!drag.swipe) return;
    var dx = p.clientX - drag.x0, dy = p.clientY - drag.y0;
    if (drag.axis) {                       /* 已经定过轴，只按那条轴走 */
      if (drag.axis === "x" && e.preventDefault) e.preventDefault();
      return;
    }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;   /* 手还没动出来，先不定轴 */
    /* 竖向占优就整个放弃这一划，把它留给页面滚动。
       缺这道闸时，上下滑题目时拇指自然带出的横向漂移就能满足 |dx|>62，被误判成换题。
       要横向明显压过竖向（1.4 倍）才认作换题手势。 */
    if (Math.abs(dx) > Math.abs(dy) * 1.4) {
      drag.axis = "x";
      if (e.preventDefault) e.preventDefault();
    } else {
      drag = null;
    }
  }, { passive: false });
  document.addEventListener("touchend", function (e) {
    if (!drag) return;
    var d = drag, p = e.changedTouches[0];
    drag = null;
    if (d.el) {
      var el = d.el;
      el.style.transition = "";
      el.style.transform = "";
      if (p.clientY - d.y0 > Math.max(90, d.h * 0.2)) closeLayer(el);
    } else if (d.swipe && d.axis === "x") {
      var dx = p.clientX - d.x0;
      if (Math.abs(dx) > 62) go(dx < 0 ? 1 : -1);
    }
  });
  /* 滑到一半被打断（来电、切后台、系统手势截走触摸序列）时，面板会卡在拖到一半的位置 */
  document.addEventListener("touchcancel", function () {
    if (drag && drag.el) {
      drag.el.style.transition = "";
      drag.el.style.transform = "";
    }
    drag = null;
  });
})();

/* ================= 导入题库：正文 → 题目 ================= */
var NUM_RE = /^\s*(\d{1,4})\s*[、.．)）]\s*([\s\S]*)$/;
/* 「第1题」式标题：题号夹在「第 … 题」中间，行首式的「1、」认不了它。
   用户报的那份 ICT 题源（md / pdf 同一份稿子）整篇都是这种排版，之前一道题都认不出。 */
var QHEAD_RE = /^\s*第\s*(\d{1,4})\s*[题題]\s*[:：、.．]?\s*([\s\S]*)$/;
/* 带标签的行：「题目：」「题干：」「选项：」。标签是排版记号，不该留在题干里 */
var QLABEL_RE = /^\s*(?:题目|题干|内容|选项)\s*[:：]\s*([\s\S]*)$/;
function unlabel(s) {
  var m = QLABEL_RE.exec(s);
  return nz(m ? m[1] : s);
}
var QOPT_RE = /^\s*([A-G])\s*[、.．)）]\s*([\s\S]*)$/;
var QOPT_LOOSE_RE = /^\s*([A-G])\s+(\S[\s\S]*)$/;
var QANS_RE = /答\s*案\s*[:：]\s*([\s\S]*)/;
/* 主观题常写「参考答案：」，必须排在 QANS_RE 前面判断，
   否则「答案：」会在「参考答案：」里先命中，把「参考」两个字留在题干里 */
var QREF_RE = /参\s*考\s*答\s*案\s*[:：]\s*([\s\S]*)/;
var QEXPL_RE = /解\s*析\s*[:：]\s*([\s\S]*)/;
/* 题型标记：（多选题）（填空题）（解答题）这类，方括号圆括号都认 */
var QKIND_RE = /[（(【]\s*(单选题|多选题|判断题|填空题|解答题|简答题|问答题|填空|简答|问答|单选|多选|判断)\s*题?\s*[)）】]/;
var QKIND_MAP = {
  "单选题": "single", "单选": "single",
  "多选题": "multi", "多选": "multi",
  "判断题": "judge", "判断": "judge",
  "填空题": "fill", "填空": "fill",
  "解答题": "short", "简答题": "short", "问答题": "short", "简答": "short", "问答": "short"
};
/* 填空题的作答位：连续下划线，或一对空括号 */
var BLANK_RE = /_{2,}|＿{2,}|[（(]\s*[)）]/;
function kindOf(stem) {
  var m = QKIND_RE.exec(stem);
  return m ? (QKIND_MAP[m[1]] || "") : "";
}
var LET = "ABCDEFG";
var OPT_INLINE_RE = [];
for (var _i = 0; _i < 7; _i++) {
  /* 分隔符后面那一档空格必须吃掉：西文写法是「A. \du  B. dr」，点号后面带空格。
     少了这个 \s*，(?=\S) 会卡在空格上，一行四个选项就只拆出一个。 */
  OPT_INLINE_RE.push(new RegExp("(?:^|(?<=\\s))" + LET.charAt(_i) + "(?:\\s*[.、．)）]|\\s+)\\s*(?=\\S)"));
}

function nz(s) { return String(s == null ? "" : s).replace(/\s+/g, " ").trim(); }
/* 抽正文时红字被包在 \u0001 \u0002 里：出题库时去掉，判答案时要用它。
   markdown 的两个排版记号也在这里落地：行内代码的反引号、**加粗**——
   界面按纯文本渲染题干，留着就会在题里看到一排 ` 和 * */
function plain(s) {
  return nz(String(s).replace(/[\u0001\u0002]/g, "")
    .replace(/\*\*([^*]+)\*\*/g, "$1").replace(/`/g, ""));
}
function redRatio(s) {
  var tot = 0, red = 0, on = false;
  for (var i = 0; i < s.length; i++) {
    var c = s.charAt(i);
    if (c === "\u0001") { on = true; continue; }
    if (c === "\u0002") { on = false; continue; }
    if (c === " ") continue;
    tot++;
    if (on) red++;
  }
  return tot ? red / tot : 0;
}
function answerLetters(v) {
  var t = String(v || "").replace(/[\s,，、.。;；:：/()（）{}【】]/g, "");
  if (!t || t.length > 8) return [];
  var up = t.toUpperCase(), out = [], i;
  for (i = 0; i < up.length; i++) if (LET.indexOf(up.charAt(i)) < 0) return [];
  for (i = 0; i < up.length; i++) if (out.indexOf(up.charAt(i)) < 0) out.push(up.charAt(i));
  return out.sort();
}
function judgeLetters(v) {
  var t = String(v || "").replace(/[\s.。]/g, "");
  if (t === "正确" || t === "对" || t === "√" || t === "是") return ["A"];
  if (t === "错误" || t === "错" || t === "×" || t === "X" || t === "否") return ["B"];
  return [];
}
/* 一行里塞了多个选项："A、x B、y C、z" */
function inlineOptions(text, want) {
  var idx = LET.indexOf(want), pos = 0, bounds = [], guard = 0;
  while (idx < LET.length && guard++ < 12) {
    var rest = text.slice(pos), m = OPT_INLINE_RE[idx].exec(rest);
    if (!m) break;
    bounds.push([pos + m.index, pos + m.index + m[0].length, LET.charAt(idx)]);
    pos = pos + m.index + m[0].length;
    idx++;
  }
  var out = [];
  for (var i = 0; i < bounds.length; i++) {
    var nxt = i + 1 < bounds.length ? bounds[i + 1][0] : text.length;
    out.push([bounds[i][2], nz(text.slice(bounds[i][1], nxt))]);
  }
  return out;
}

function parseBankText(text) {
  var raw = String(text).replace(/\r/g, "\n").split("\n");
  var qs = [], cur = null, expect = 1;
  function close() { if (cur) qs.push(cur); cur = null; }

  for (var li = 0; li < raw.length; li++) {
    var line = nz(raw[li]);
    if (!line) continue;
    /* markdown 的代码围栏是排版记号，不是题干；里面的代码行照旧收进题干 */
    if (/^[`~]{3,}/.test(line)) continue;
    var head, answer = null, explain = null, ref = null;
    var me = QEXPL_RE.exec(line);
    if (me) { explain = me[1].trim(); line = nz(line.slice(0, me.index)); }
    /* 先认「参考答案：」再认「答案：」，顺序不能反 */
    var mr = QREF_RE.exec(line);
    if (mr) { ref = mr[1].trim(); line = nz(line.slice(0, mr.index)); }
    else {
      var ma = QANS_RE.exec(line);
      if (ma) { answer = ma[1].trim(); line = nz(line.slice(0, ma.index)); }
    }
    /* 「正确答案：A」「答案解析：X」这类带前缀/后缀的标签，切完会剩下一截光杆标签
       （「正确」「答案」）。它不是题干也不是选项，留着会被当成选项的续行拼到最后一个选项上。 */
    if (/^\s*(?:参考|正确|标准|答案|题目|题干|选项|解析|答案解析)*\s*[:：]?\s*$/.test(line)) line = "";
    head = unlabel(line);

    var mn = NUM_RE.exec(head) || QHEAD_RE.exec(head);
    /* 「第N题」这种标题没有歧义，不受连续号限制：从中间截一份题集（第12题起）也认得出来。
       行首「1、」就不行——题干里以数字开头的行太多，必须靠连续性挡误判。 */
    if (mn && (+mn[1] >= expect && +mn[1] <= expect + 3 || QHEAD_RE.test(head))) {
      close();
      cur = { num: +mn[1], stem: [unlabel(mn[2])], options: [], answer_text: "", ref_text: "",
              explain: [], in_expl: false };
      expect = cur.num + 1;
    } else if (cur && head) {
      if (cur.in_expl) {
        cur.explain.push(head);
      } else {
        var want = LET.charAt(cur.options.length);
        var mo = QOPT_RE.exec(head) || QOPT_LOOSE_RE.exec(head);
        if (mo && mo[1] === "A" && cur.options.length && !cur.answer_text) {
          // 第二次从 A 开始，说明上一批 A/B/C 是题干里的子项，不是选项
          for (var k = 0; k < cur.options.length; k++) {
            cur.stem.push(cur.options[k][0] + "、" + cur.options[k][1]);
          }
          cur.options = [];
          want = "A";
        }
        if (mo && mo[1] === want) {
          var multi = cur.options.length ? [] : inlineOptions(head, want);
          if (multi.length > 1) {
            for (var m2 = 0; m2 < multi.length; m2++) {
              cur.options.push([multi[m2][0], multi[m2][1], redRatio(multi[m2][1])]);
            }
          } else {
            cur.options.push([mo[1], nz(mo[2]), redRatio(mo[2])]);
          }
        } else if (!cur.options.length) {
          cur.stem.push(head);
        } else {
          var last = cur.options[cur.options.length - 1];
          last[1] = nz(last[1] + " " + head);
          last[2] = Math.max(last[2], redRatio(head));
        }
      }
    }
    if (cur) {
      if (answer !== null) cur.answer_text = nz(cur.answer_text + " " + answer);
      if (ref !== null) cur.ref_text = nz(cur.ref_text + " " + ref);
      if (explain !== null) { cur.in_expl = true; cur.explain.push(explain); }
    }
  }
  close();

  var out = [];
  for (var i = 0; i < qs.length; i++) {
    var q = qs[i], stem = nz(q.stem.join(" ")), opts = [];
    for (var j = 0; j < q.options.length; j++) opts.push([q.options[j][0], plain(q.options[j][1])]);
    var letters = answerLetters(q.answer_text);
    var ans = letters.length ? letters : judgeLetters(q.answer_text);
    var type = "single";
    /* 显式题型标记优先级最高：写了「填空题」就是填空题，后面所有靠答案形态
       猜出来的结论都不能把它改回客观题——那正是「把主观题伪装成自动对错」 */
    var kind = kindOf(stem);
    if (!letters.length && ans.length && kind !== "fill" && kind !== "short") {
      type = "judge";
      if (!opts.length) {
        opts = [["A", "正确"], ["B", "错误"]];
        stem = nz(stem.replace(/(\s*(正确|错误|对|错)){1,2}$/, ""));
      }
    }
    if (ans.length > 1 && kind !== "fill" && kind !== "short") type = "multi";
    if (!ans.length && kind !== "fill" && kind !== "short") {
      var red = [];
      for (j = 0; j < q.options.length; j++) if (q.options[j][2] > 0.3) red.push(q.options[j][0]);
      if (red.length) { ans = red; type = red.length > 1 ? "multi" : "single"; }
    }
    if (/[（(【]\s*多选/.test(stem) && kind !== "fill" && kind !== "short") type = "multi";
    if (/[（(【]\s*单选/.test(stem) && kind !== "fill" && kind !== "short") type = "single";
    if (type === "single" && opts.length === 2) {
      var pair = opts[0][1] + "|" + opts[1][1];
      if (pair === "正确|错误" || pair === "对|错") type = "judge";
    }
    if (kind === "fill" || kind === "short") {
      /* 主观题：选项不是选项，是正文的一部分（有些题库会把「要点」排成 A/B/C） */
      if (opts.length) {
        var extra = opts.map(function (o) { return o[0] + "、" + o[1]; }).join(" ");
        stem = nz(stem + " " + extra);
        opts = [];
      }
      type = kind;
      ans = [];
    } else if (!opts.length && !ans.length && BLANK_RE.test(stem)) {
      /* 没写题型标记，但题干里有作答横线：按填空题收，总比当成无答案的选择题丢掉好 */
      type = "fill";
    } else if (!opts.length && !ans.length && q.ref_text) {
      /* 有参考答案、没选项、也没有可判的字母：这是解答题 */
      type = "short";
    }
    ans = ans.filter(function (a) {
      for (var n = 0; n < opts.length; n++) if (opts[n][0] === a) return true;
      return false;
    }).sort();
    var refText = plain(q.ref_text);
    if ((type === "fill" || type === "short") && !refText) refText = plain(q.answer_text);
    out.push({
      num: q.num, pnum: q.num,
      stem: plain(stem.replace(/[（(【]\s*(多选|单选|判断|填空|解答|简答|问答)[题]?\s*[)）】]/g, " ")),
      type: type, options: opts, answer: ans, ans_raw: q.answer_text,
      ref: (type === "fill" || type === "short") ? refText : "",
      explain: plain(q.explain.join(" ")), note: "", flag: ""
    });
  }

  var seen = {}, ded = [], dup = 0;
  out.forEach(function (x) {
    var k = x.stem.replace(/[^0-9A-Za-z一-鿿]/g, "") + "||" + x.options.map(function (o) { return o[1]; }).join("|");
    if (seen[k]) { dup++; return; }
    seen[k] = 1;
    ded.push(x);
  });
  ded.report = { raw: out.length, dup: dup };
  return ded;
}

/* ================= 导入流程与进度 ================= */
var IMPORT_STAGES = { pick: .06, read: .22, extract: .5, parse: .72, save: .92, done: 1 };
var importName = "";

function openImport() {
  var sh = document.getElementById("sheet3");
  sh.innerHTML = '<div class="handle"></div><h2>导入题库</h2>' +
    '<div class="sl-hint" style="margin:0 0 18px">支持 PDF、Word（.docx）和 txt / md。两种排版都认：' +
    '「1、题干 / A、选项 / 答案：X / 解析：」，或「第1题 / 题目：… / A. 选项 B. 选项 / 答案：A / 解析：」。' +
    '带解析的会一起导入；红字标答案的文档也能识别。完整规则见仓库 docs/导入指南.md。</div>' +
    '<button class="sheet-act" onclick="pickFile()">选择文件导入</button>' +
    '<div class="sl-hint" style="margin:14px 0 0">PDF 需要有文字层：扫描件、图片版和加密文件读不出内容，会明确提示而不是当成导入成功。</div>' +
    '<div class="sl-hint" style="margin:10px 0 0">也可以在微信里长按文件 →「用其他应用打开」→ 选「GIme」。</div>' +
    '<div id="impBar" style="display:none">' +
      '<div class="track" style="margin:22px 0 8px"><i id="impFill"></i></div>' +
      '<div class="sl-hint" id="impMsg" style="margin:0">准备中…</div>' +
    "</div>";
  openLayer(sh);
}
function pickFile() {
  if (!window.Android || !Android.pickFile) { toast("请在手机上使用 App 导入"); return; }
  importStage("pick");
  Android.pickFile();
}
function importStage(k) {
  var sh = document.getElementById("sheet3");
  /* 微信「用其他应用打开」直接递文件进来时面板还没打开；上一次的成功页也会顶掉进度条。
     两种情况都得先把导入面板重建出来，否则进度和结果都写在看不见的地方。 */
  if (sh && (!document.getElementById("impBar") || !sh.classList.contains("on"))) openImport();
  var bar = document.getElementById("impBar"), fill = document.getElementById("impFill"),
      msg = document.getElementById("impMsg");
  if (!bar) return;
  bar.style.display = "block";
  fill.style.width = Math.round((IMPORT_STAGES[k] || 0) * 100) + "%";
  msg.textContent = ({
    pick: "等待选择文件…", read: "读取文件…", extract: "提取正文…",
    parse: "识别题目和解析…", save: "生成题库…", done: "完成"
  })[k] || "处理中…";
}
window.importStage = importStage;
/* 原生层出错时要能给用户一句提示，得有个挂到 window 上的入口 */
window.toast = toast;

/* 一道题能不能进题库：客观题要有答案且至少两个选项；
   主观题只要有题干就行（参考答案缺失也收，界面会标「未提供参考答案」，
   总比默默丢掉强）。判分与否交给 isObjective，不在这里一刀切。 */
function usableQ(x) {
  if (isSubjective(x.type)) return !!x.stem;
  return x.answer.length > 0 && x.options.length >= 2;
}

window.onImportText = function (name, text) {
  importName = name || "未命名题库";
  importStage("parse");
  setTimeout(function () {
    var qs;
    try { qs = parseBankText(text); }
    catch (e) { onImportError("解析失败：" + e.message); return; }
    var ok = qs.filter(usableQ);
    if (!qs.length) { onImportError("没在文件里认出题目（题号要像 1、2、3 这样连续编号）"); return; }
    importStage("save");
    setTimeout(function () { finishImport(qs, ok); }, 30);
  }, 60);
};
/* 导入结果的统计口径统一在这里：无答案题必须在「原始解析结果」上数，
   usable 已经把它滤掉了，在 usable 上数永远是 0。主观题另算，不算「无答案」。 */
function importReport(all, usable) {
  var by = { single: 0, multi: 0, judge: 0, fill: 0, short: 0 };
  var noRef = 0;
  usable.forEach(function (x) {
    if (by[x.type] !== undefined) by[x.type]++;
    if (isSubjective(x.type) && !String(x.ref || "").trim()) noRef++;
  });
  var noans = all.filter(function (x) {
    return !isSubjective(x.type) && !x.answer.length;
  }).length;
  return {
    total: all.length,
    usable: usable.length,
    noans: noans,
    dropped: all.length - usable.length - noans,
    noRef: noRef,
    by: by,
    dup: (all.report && all.report.dup) || 0
  };
}
/* 结果页的统计行：分题型报数，主观题单列「参考答案缺失」，
   这样用户能看出是文档格式问题还是真的没写答案，而不是只看到一句「缺选项 N」 */
function importLine(rep) {
  var b = rep.by || {};
  var parts = [];
  if (b.single) parts.push("单选 " + b.single);
  if (b.multi) parts.push("多选 " + b.multi);
  if (b.judge) parts.push("判断 " + b.judge);
  if (b.fill) parts.push("填空 " + b.fill);
  if (b.short) parts.push("解答 " + b.short);
  var s = "认出 " + rep.total + " 题，收录 " + rep.usable + " 题";
  if (parts.length) s += "（" + parts.join("、") + "）";
  var bad = [];
  if (rep.noans) bad.push("无答案 " + rep.noans);
  if (rep.dropped) bad.push("缺选项 " + rep.dropped);
  if (rep.noRef) bad.push("缺参考答案 " + rep.noRef);
  if (rep.dup) bad.push("重复 " + rep.dup);
  if (bad.length) s += "；未收录或待补：" + bad.join("、");
  return esc(s);
}
function finishImport(all, usable) {
  var sid = "import_" + Date.now().toString(36);
  var subj = { id: sid, name: bankName(importName), file: importName, count: usable.length, custom: true };
  usable.forEach(function (x, i) {
    x.num = i + 1;
    x.id = sid + "-" + i;
    x.subject = sid;
    x.source = importName;
  });
  var payload = { subject: subj, questions: usable };
  var saved = true;
  if (window.Android && Android.saveBank) saved = Android.saveBank(sid, JSON.stringify(payload));
  /* 存盘失败就别往列表里塞：否则下次启动题库凭空消失，比当场报错更糟 */
  if (saved) {
    BANK.subjects.push(subj);
    usable.forEach(function (x) { byId[x.id] = x; });
    BANK.questions = BANK.questions.concat(usable);
  }
  importStage("done");
  var rep = importReport(all, usable);
  document.getElementById("sheet3").innerHTML =
    '<div class="handle"></div><div class="glass" style="position:static;transform:none;opacity:1;visibility:visible;max-width:none;width:auto;box-shadow:none">' +
      '<div class="icon">' + (saved ? "✓" : "!") + "</div>" +
      '<div class="big">' + (saved ? usable.length : 0) + "</div>" +
      "<h2>" + (saved ? "导入成功" : "没能保存") + "</h2><p>" + esc(subj.name) + "　" +
      (saved ? "已存到本机" : "写文件失败，题库未加入列表，请检查存储空间后重试") + "</p></div>" +
    '<div class="legend" style="margin:0 0 16px">' + importLine(rep) + "</div>" +
    (saved
      ? '<button class="sheet-act" onclick="closeTop();goTab(&quot;bank&quot;)">去看这个题库</button>'
      : '<button class="sheet-act" onclick="openImport()">重新导入</button>');
  save();
  renderAll();
}
function bankName(file) {
  return String(file).replace(/\.(docx|doc|pdf|txt|md)$/i, "").replace(/^[\s\-—_]+|[\s\-—_]+$/g, "") || "导入题库";
}
window.onImportError = function (msg) {
  var sh = document.getElementById("sheet3");
  if (!sh || !sh.classList.contains("on")) { toast(msg); return; }
  sh.innerHTML = '<div class="handle"></div><h2>导入失败</h2>' +
    '<div class="note" style="margin:0 0 18px">' + esc(msg) + "</div>" +
    '<button class="sheet-act" onclick="openImport()">重试</button>';
};

/* ================= 已导入 / 已隐藏题库的注册表 ================= */
function bootImportedBanks() {
  if (!window.Android || !Android.loadBanks) return;
  var list;
  try { list = JSON.parse(Android.loadBanks()); } catch (e) { return; }
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    if (!b || !b.subject || !b.questions) continue;
    BANK.subjects.push(b.subject);
    for (var j = 0; j < b.questions.length; j++) {
      var q = b.questions[j];
      q.subject = b.subject.id;
      byId[q.id] = q;
      BANK.questions.push(q);
    }
  }
  banksLoaded = true;
}
function subjectOf(sid) {
  for (var i = 0; i < BANK.subjects.length; i++) if (BANK.subjects[i].id === sid) return BANK.subjects[i];
  return null;
}
function removeBank(sid) {
  /* 原生删文件失败时不能假装删了：刷新后题库会诈尸，用户以为数据丢了 */
  if (window.Android && Android.deleteBank) {
    var okDel = false;
    try { okDel = Android.deleteBank(sid); } catch (e) { okDel = false; }
    if (!okDel) { toast("删除失败，题库还在，请稍后重试"); return false; }
  }
  BANK.subjects = BANK.subjects.filter(function (s) { return s.id !== sid; });
  BANK.questions = BANK.questions.filter(function (q) {
    if (q.subject !== sid) return true;
    delete byId[q.id];
    delete prog[q.id];
    return false;
  });
  /* 进行中的会话如果属于这个题库，题都没了留着只会渲染出空页，直接丢掉 */
  if (S && S.subject === sid) {
    S = null;
    localStorage.removeItem(LS.j);
    document.getElementById("quiz").classList.remove("on");
  }
  if (set.hidden) delete set.hidden[sid];
  save();
  renderAll();
  return true;
}
function askDeleteBank(sid) {
  var s = subjectOf(sid);
  if (!s) return;
  /* 所有题库都是用户自己导入的，所以只有「删除」一种处理；
     确认框里必须把连带影响说清楚：题目、进度、错题、收藏、进行中的会话 */
  glass({ title: "删除「" + s.name + "」？",
    desc: "这个题库的 " + stats(sid).total + " 道题会一起删掉，它们的做题记录、错题、收藏也会清空，无法恢复。",
    ok: ["删除", function () { if (removeBank(sid)) toast("题库已删除"); }] });
}

/* 改名：显示名只存在这个题库自己的 json 里，所以改名 = 整包重写（id 不变）。
   进度、错题、收藏都挂在题目 id 上，不跟着名字走，改完不会掉记录。 */
function askRenameBank(sid) {
  var s = subjectOf(sid);
  if (!s) return;
  var sh = document.getElementById("sheet3");
  sh.innerHTML = '<div class="handle"></div><h2>给题库改个名</h2>' +
    '<input class="rn-box" id="rnName" maxlength="30" placeholder="题库显示名" ' +
      'value="' + esc(s.name) + '" onkeydown="if(event.key===&quot;Enter&quot;)renameBank(&quot;' + s.id + '&quot;, this.value)">' +
    '<button class="sheet-act" style="margin-top:18px" onclick="renameBank(&quot;' + s.id + '&quot;, document.getElementById(&quot;rnName&quot;).value)">保存</button>' +
    '<div class="sl-hint" style="margin:16px 0 0">只改显示名。题目里的「题源」标记仍写导入时的文件名——那是这份题出处的记录，改了会对不上原文件。</div>';
  openLayer(sh);
  /* 面板滑上来要 250ms，早于它 focus 会被随后的 transform 打断 */
  setTimeout(function () { var b = document.getElementById("rnName"); if (b) b.focus(); }, 320);
}
function renameBank(sid, name) {
  var s = subjectOf(sid);
  if (!s) return;
  var n = nz(String(name || ""));
  if (n.length > 30) n = n.slice(0, 30);
  if (!n) { toast("名字别空着"); return; }
  if (n === s.name) { closeTop(); return; }
  var old = s.name;
  s.name = n;
  if (window.Android && Android.saveBank) {
    var payload = { subject: s, questions: BANK.questions.filter(function (q) { return q.subject === sid; }) };
    var okSave = false;
    try { okSave = Android.saveBank(sid, JSON.stringify(payload)); } catch (e) { okSave = false; }
    if (!okSave) { s.name = old; toast("保存失败，名字没改"); return; }
  }
  closeTop();
  renderAll();
  toast("已改名为「" + n + "」");
}

/* 左滑面板：题库卡片和首页「今日待刷」行共用这一套手势；竖向手势留给页面滚动，不抢 */
(function () {
  var sw = null;
  function faceOf(el) { return el && el.querySelector ? el.querySelector(".card, .task") : null; }
  /* 面板多宽由里面几个按钮决定（只有删除=92，改名+删除=184），现场量不写死 */
  function panelW(el) { var p = el.firstElementChild; return p && p.offsetWidth ? p.offsetWidth : 92; }
  /* 起点偏移记在 base 上，move 里只算不改：已打开的卡片要从面板宽度往回算，
     否则右滑的位移会被当成从 0 开始，收不回去（原来用 locked 直接禁掉，
     结果就是删除区一旦打开，在这个页面里再也关不掉）。 */
  document.addEventListener("touchstart", function (e) {
    if (curTab !== "bank" && curTab !== "home") { sw = null; return; }
    var t = e.touches[0];
    var host = e.target.closest ? e.target.closest(".swipe") : null;
    sw = null;
    if (!host) return;
    var w = panelW(host);
    host.style.setProperty("--swx", "-" + w + "px");
    sw = { el: host, w: w, x0: t.clientX, y0: t.clientY,
           base: host.classList.contains("open") ? -w : 0, off: 0 };
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (!sw) return;
    var t = e.touches[0], dx = t.clientX - sw.x0, dy = t.clientY - sw.y0;
    if (Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
    if (Math.abs(dx) < 8) return;
    sw.off = Math.max(-sw.w, Math.min(0, sw.base + dx));
    var c = faceOf(sw.el);
    if (!c) return;
    c.style.transition = "none";
    c.style.transform = "translateX(" + sw.off + "px)";
  }, { passive: true });
  document.addEventListener("touchend", function () {
    if (!sw) return;
    var el = sw.el, open = sw.off < -sw.w * .435, c = faceOf(el);
    if (c) { c.style.transition = ""; c.style.transform = ""; }
    [].slice.call(document.querySelectorAll(".swipe.open")).forEach(function (o) {
      if (o !== el) o.classList.remove("open");
    });
    if (open) el.classList.add("open"); else el.classList.remove("open");
    sw = null;
  });
  /* 被打断的横滑要把卡片弹回原位，否则它停在半开的位置上 */
  document.addEventListener("touchcancel", function () {
    if (!sw) return;
    var c = faceOf(sw.el);
    if (c) { c.style.transition = ""; c.style.transform = ""; }
    sw = null;
  });
})();

/* ================= 启动 ================= */
applyTheme();
bootImportedBanks();
/* 先把落盘的更新状态换算成小红点，再画界面：否则「我的」第一次渲染时
   标记还是空的，要等用户点进来重画才出现 */
updSyncMark();
renderAll();
/* 胶囊先按实测尺寸落位（不带动画）。字号切换和转屏都会改按钮宽度，
   所以 resize 之后要重新量一次，否则胶囊和文字会错开一截。 */
moveTabPill(false);
window.addEventListener("resize", function () { moveTabPill(false); });
bootSplash();      /* 启动页要在首屏都画好之后再编排，此时 #splash 已经盖在最上层 */
/* 上次是交卷/放弃到一半被杀掉的会话不该再被恢复出来：状态停在 submitting 说明
   结算没走完，按 running 续上比丢掉整场作答更合理。
   抽成函数是为了回归测试能直接调真实现，而不是复制一份规则。 */
function normalizeSession(s) {
  if (!s || s.mode !== "exam") return s;
  if (s.state === "submitted" || s.state === "abandoned") return null;
  /* 注意 submitting 也要归一成 running：否则表不会走、交卷入口也不收，
     这场考试就永久卡死在「正在交卷」上。 */
  s.state = "running";
  return s;
}
S = normalizeSession(S);
if (S === null) localStorage.removeItem(LS.j);
if (S && S.order && S.order.length && S.order[S.idx] && byId[S.order[S.idx]]) {
  render();
  document.getElementById("quiz").classList.add("on");
}
/* 最后再告诉原生层「页面好了」：此时导入入口函数都已经挂上，
   原生层排队的文件（冷启动时从文件管理器递进来的）可以开始读了。 */
try { if (window.Android && Android.pageReady) Android.pageReady(); } catch (e) {}
